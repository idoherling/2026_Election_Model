  --p-likud:#225A9E; --p-yashar:#2b8fd4; --p-together:#149a44;
  --p-dems:#2A38D7; --p-yb:#4d7fb8; --p-shas:#141412; --p-utj:#003366;
  --p-otzma:#e03e00; --p-rzp:#214785; --p-raam:#15793D; --p-jl:#c32b35;
  --p-zh:#6b7a1f; --p-bw:#0a94dd; --p-amcha:#6b3fa0; --p-unity:#8a867d;
}

    --line:#f2efe8; --line2:#f2efe8; --dead:#5c594f;
    --accent:#5b8ded; --blue:#6b9fe8; --hit:#f2efe814;
    --bloc-nb:#7094e6; --bloc-anti:#33a3b3; --bloc-arab:#3aa268; --bloc-una:#9aa196;
    --field:#0038b8; --field-ink:#f5f3ee;
    --p-likud:#4d82c8; --p-yashar:#62B9F2; --p-together:#2ec46a;
    --p-dems:#6470e8; --p-yb:#9AC0E2; --p-shas:#e8e5de; --p-utj:#4677a8;
    --p-otzma:#ff6a33; --p-rzp:#5c85c0; --p-raam:#34a05e; --p-jl:#e25563;
    --p-zh:#a3b53c; --p-bw:#0DAAFF; --p-amcha:#9d7bd8; --p-unity:#9aa196;
  }
}
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#101010; --card:#101010; --ink:#f2efe8; --ink2:#c9c5bc; --muted:#8f8b82;
  --line:#f2efe8; --line2:#f2efe8; --dead:#5c594f;
  --accent:#5b8ded; --blue:#6b9fe8; --hit:#f2efe814;
  --bloc-nb:#7094e6; --bloc-anti:#33a3b3; --bloc-arab:#3aa268; --bloc-una:#9aa196;
  --field:#0038b8; --field-ink:#f5f3ee;
  --p-likud:#4d82c8; --p-yashar:#62B9F2; --p-together:#2ec46a;
  --p-dems:#6470e8; --p-yb:#9AC0E2; --p-shas:#e8e5de; --p-utj:#4677a8;
  --p-otzma:#ff6a33; --p-rzp:#5c85c0; --p-raam:#34a05e; --p-jl:#e25563;
  --p-zh:#a3b53c; --p-bw:#0DAAFF; --p-amcha:#9d7bd8; --p-unity:#9aa196;
}
:root{--warn:#c2410c;--ok:#1a7a44;--soft:#14141226}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--warn:#ff8a5c;--ok:#3aa268;--soft:#f2efe82e}}
:root[data-theme="dark"]{--warn:#ff8a5c;--ok:#3aa268;--soft:#f2efe82e}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font:400 16px/1.55 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body,html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:"IBM Plex Sans Hebrew","IBM Plex Sans",sans-serif;letter-spacing:0}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
h1,h2,h3{line-height:1.1;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
.n,.ltr{direction:ltr;unicode-bidi:isolate}
.n{font-family:"IBM Plex Mono","IBM Plex Sans Hebrew",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--ink);text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;inset-inline-start:8px;top:8px;z-index:100;background:var(--ink);color:var(--paper);padding:10px 14px;font-weight:700;text-decoration:none;clip-path:inset(50%);white-space:nowrap}
.skip:focus{clip-path:none}
button{font:inherit}
.masthead{border-top:14px solid var(--ink);border-bottom:3px solid var(--ink);padding:18px 0 14px}
.masthead .wrap{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand{font-weight:700;font-size:22px;letter-spacing:-.01em;text-transform:uppercase}
.brand a{text-decoration:none}
.brand small{font-weight:500;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.22em;display:block;margin-top:4px}
html[dir="rtl"] .brand small{letter-spacing:.04em}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl button{border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 12px "IBM Plex Sans Hebrew","IBM Plex Sans",sans-serif;padding:7px 14px;cursor:pointer;letter-spacing:.06em;min-height:36px}
.dateline{font:500 11.5px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;text-align:end}
html[dir="rtl"] .dateline{letter-spacing:.02em}
.eyebrow{font:700 11px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
html[dir="rtl"] .eyebrow{letter-spacing:.03em}
.k{font:700 10.5px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
html[dir="rtl"] .k{letter-spacing:.02em}

/* opening */
.open{padding:30px 0 8px}
.open h1{font-size:clamp(30px,5vw,50px);max-width:18ch}
.open .lede{color:var(--ink2);max-width:64ch;margin-top:14px;font-size:17px}
.strip{margin:26px 0 0}
.strip .labs,.strip .segs{display:flex;gap:2px}
.strip .labs > div{min-width:0;padding-bottom:6px}
.strip .labs b{display:block;font:600 clamp(20px,3.2vw,30px)/1 "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;font-variant-numeric:tabular-nums}
.strip .labs span{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.strip .segs{position:relative;height:18px}
.strip .segs i{display:block;background:var(--ink);height:100%}
.strip .segs i.hollow{background:transparent;border:2px solid var(--ink)}
.strip .mark{position:absolute;top:-7px;bottom:-7px;width:0;border-inline-start:2px dashed var(--accent)}
.strip .cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.toc{display:flex;flex-wrap:wrap;gap:6px 18px;margin:22px 0 0;padding:12px 0 0;border-top:1px solid var(--soft);font-size:13.5px}
.toc a{text-decoration-thickness:1px}

/* a finding */
.ins{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(0,1fr);gap:0 28px;padding:30px 0 26px;border-top:3px solid var(--ink);margin-top:26px;scroll-margin-top:10px}
.ins.wide{grid-template-columns:64px minmax(0,1fr)}
.ins .num{font:600 44px/1 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--accent)}
.ins .txt{min-width:0}
.ins h2{font-size:clamp(21px,2.6vw,27px);margin-bottom:12px}
.ins .txt p{max-width:62ch;margin-top:10px;font-size:15.5px}
.ins .txt p:first-of-type{margin-top:0}
.ins ul{margin:10px 0 0;padding-inline-start:20px;max-width:62ch}
.ins li{margin:8px 0;font-size:15px}
.ins li b{font-weight:600}
.src{font-size:12.5px;color:var(--muted);margin-top:14px;max-width:62ch;line-height:1.6}
.src a{color:var(--ink2);text-decoration-thickness:1px}
figure{margin:0;min-width:0}
.fig{border-top:1px solid var(--ink);padding-top:10px}
.fig h3{font-size:14px;font-weight:600;letter-spacing:0;line-height:1.3}
.fig .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.fig figcaption{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px;background:var(--ink)}
.legend i.o{background:var(--paper);border:2px solid var(--ink2)}
.legend i.a{background:var(--accent)}
.legend i.g{background:var(--muted)}
.legend i.band{border-radius:0;width:18px;height:6px;background:var(--soft);vertical-align:1px}
svg.ch{display:block;width:100%;height:auto;direction:ltr;margin-top:8px;overflow:visible}
svg.ch text{font:500 11px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;fill:var(--ink2)}
svg.ch text.v{fill:var(--ink);font-weight:600}
svg.ch text.lab{font:600 11.5px "IBM Plex Sans","IBM Plex Sans Hebrew",sans-serif;fill:var(--ink)}
svg.ch .grid{stroke:var(--soft);stroke-width:1;fill:none}
svg.ch .axis{stroke:var(--ink);stroke-width:1;fill:none}
svg.ch .hit{fill:transparent;stroke:none}
/* row charts (label | track | value): HTML, so they mirror in Hebrew */
.rows{margin-top:10px;display:grid;gap:7px}
.row{display:grid;grid-template-columns:minmax(96px,34%) minmax(0,1fr) auto;gap:0 10px;align-items:center;font-size:13px;min-height:22px}
.rows.db .row{grid-template-columns:minmax(84px,26%) minmax(0,1fr) auto}
.row .lb{min-width:0;overflow-wrap:anywhere;line-height:1.25}
.row .lb small{display:block;color:var(--muted);font-size:11.5px}
.row .tr{position:relative;height:14px}
.row .tr .bar{position:absolute;inset-block:2px;inset-inline-start:0;background:var(--muted);border-start-end-radius:4px;border-end-end-radius:4px}
.row .tr .band{position:absolute;inset-block:4px;background:var(--soft)}
.row .tr .tick{position:absolute;top:-3px;bottom:-3px;width:0;border-inline-start:2px dashed var(--ink)}
.row .tr .rail{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--ink2)}
.row .tr .dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px -6px 0;border-radius:50%;background:var(--ink);box-shadow:0 0 0 2px var(--paper)}
.row .tr .dot.o{background:var(--paper);border:2px solid var(--ink2);box-shadow:none}
.row .vl{font:600 12.5px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:end;min-width:44px}
.row .vl small{font-weight:500;color:var(--muted)}
.row.hl .bar,.row.hl .dot{background:var(--accent)}
.row.hl .lb{font-weight:600}
.row[data-tip]{cursor:default}
.rank{margin-top:10px;display:grid;gap:0;font-size:13px}
.rank > div{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:0 10px;padding:5px 0;border-bottom:1px solid var(--soft)}
.rank .hl{font-weight:600}
.rank .hl span:first-child{color:var(--accent)}
.stat{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:12px}
.stat div{min-width:0}
.stat b{display:block;font:600 26px/1.1 "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* the forecast */
.next{border:3px solid var(--ink);padding:18px 20px 20px;margin-top:18px}
.next .cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px 34px}
.next .cols > div{min-width:0}
.next .row{grid-template-columns:minmax(110px,38%) minmax(0,1fr) auto;font-size:14px;min-height:26px}
.next .row .tr{height:18px}
.next .row .bar{background:var(--ink)}
.next .row.hl .bar{background:var(--accent)}
.next p{font-size:14.5px;max-width:64ch;margin-top:10px}
.tl{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:108px minmax(0,1fr);gap:0 12px;padding:7px 0;border-bottom:1px solid var(--soft);font-size:13.5px;margin:0}
.tl li b{font:600 12px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;color:var(--ink2)}
.tw{overflow-x:auto;margin-top:10px}
table.t{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}
table.t th{font:700 10px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);text-align:start;padding:8px 10px 6px 0;border-bottom:2px solid var(--ink);vertical-align:bottom}
html[dir="rtl"] table.t th{letter-spacing:0;padding:8px 0 6px 10px}
table.t td{padding:7px 10px 7px 0;border-bottom:1px solid var(--soft);vertical-align:top}
html[dir="rtl"] table.t td{padding:7px 0 7px 10px}
table.t tr.grp td{font-weight:600;border-bottom:1px solid var(--ink);padding-top:14px}
table.t td.dir{white-space:nowrap;font:600 12px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace}
td.dir.up{color:var(--ok)} td.dir.dn{color:var(--warn)}
details{margin-top:16px}
summary{cursor:pointer;font-weight:600;font-size:14.5px}
.honest{border-inline-start:4px solid var(--accent);padding:4px 0 4px 14px;margin:16px 0 0;max-width:72ch;font-size:14px}
.after{padding:28px 0 6px;border-top:3px solid var(--ink);margin-top:30px}
.after h2{font-size:clamp(20px,2.6vw,26px);margin-bottom:8px}
.after ul{margin:8px 0 0;padding-inline-start:20px;max-width:74ch}
.after li{margin:7px 0;font-size:15px}
footer{border-top:14px solid var(--ink);margin-top:46px;padding:22px 0 44px;font-size:12.5px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12.5px;line-height:1.4;padding:7px 10px;max-width:260px;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
@media (max-width:900px){
  .ins,.ins.wide{grid-template-columns:48px minmax(0,1fr)}
  .ins figure{grid-column:2;margin-top:20px}
  .ins .num{font-size:34px}
  .next .cols{grid-template-columns:1fr}
}
@media (max-width:600px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .masthead .wrap{align-items:flex-start}
  .dateline{text-align:start}
  .ins,.ins.wide{grid-template-columns:1fr;gap:0}
  .ins .num{font-size:30px;margin-bottom:6px}
  .ins figure{grid-column:1}
  .next{padding:14px 14px 16px}
  .tl li{grid-template-columns:86px minmax(0,1fr)}
  .strip .labs span{font-size:11.5px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@media print{.ctl,.skip{display:none !important} body{background:#fff;color:#000}}
</style>

/* ---------- figures ---------- */
const SVGNS = "http://www.w3.org/2000/svg";
function svg(w, h, body, label){ return `<svg class="ch" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${body}</svg>`; }
const tipAttr = t => ` data-tip="${esc(t)}"`;

function figBlocs(){
  const max = 70, x = v => (100 * v / max).toFixed(2) + "%";
  const rows = [["nb", T.stripNb], ["anti", T.stripAnti], ["arab", T.stripArab]].map(([k, name]) => {
    const a = B[k].seats22, b = B[k].seats26, lo = Math.min(a, b), hi = Math.max(a, b);
    const tip = `${name}: ${a} → ${b} ${T.seats} (${sgn(b - a)})`;
    return `<div class="row"${tipAttr(tip)}><div class="lb">${esc(name)}</div><div class="tr"><i class="rail" style="inset-inline-start:${x(lo)};width:${x(hi - lo)}"></i><i class="dot o" style="inset-inline-start:${x(a)}"></i><i class="dot" style="inset-inline-start:${x(b)}"></i></div><div class="vl">${N(a)} → ${N(b)} <small>${N(sgn(b - a))}</small></div></div>`;
  }).join("");
  return `<h3>${HE ? "מנדטים לפי מחנה" : "Seats by camp"}</h3><div class="rows db">${rows}</div>
    <div class="legend"><span><i class="o"></i>${N(2022)}</span><span><i></i>${N(2026)}</span></div>
    <figcaption>${HE ? `הסולם: ${N(0)} עד ${N(70)} מנדטים.` : `Scale: ${N(0)} to ${N(70)} seats.`}</figcaption>`;
}

function figArab(){
  const W = 440, H = 230, L = 34, Rr = 12, Tp = 26, Bt = 34, lo = 4, hi = 19, n = hi - lo + 1;
  const bw = (W - L - Rr) / n, max = Math.max(...Object.values(AR.hist)), y = v => Tp + (H - Tp - Bt) * (1 - v / max);
  let b = "";
  for (const t of [100, 200, 300, 400]) b += `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  for (let s = lo; s <= hi; s++) {
    const c = AR.hist[s] || 0, x0 = L + (s - lo) * bw;
    if (c) { const hgt = Math.max(2, H - Bt - y(c));
      b += `<rect x="${(x0 + 1).toFixed(1)}" y="${(H - Bt - hgt).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${hgt.toFixed(1)}" rx="3" fill="var(--muted)"/>`;
      if (c !== max) b += `<text class="v" x="${(x0 + bw / 2).toFixed(1)}" y="${(H - Bt - hgt - 5).toFixed(1)}" text-anchor="middle">${c}</text>`;
      b += `<rect class="hit" x="${x0.toFixed(1)}" y="${Tp}" width="${bw.toFixed(1)}" height="${H - Tp - Bt}"${tipAttr(HE ? `${s} מנדטים: ${c} סקרים` : `${s} seats: ${c} polls`)}/>`; }
    if (s % 2 === 0 || s === hi) b += `<text x="${(x0 + bw / 2).toFixed(1)}" y="${H - Bt + 15}" text-anchor="middle">${s}</text>`;
  }
  const xr = L + (AR.result - lo + .5) * bw;
  b += `<line class="axis" x1="${L}" x2="${W - Rr}" y1="${H - Bt}" y2="${H - Bt}"/>`;
  b += `<line x1="${xr}" x2="${xr}" y1="${Tp - 4}" y2="${H - Bt}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>`;
  b += `<text class="lab" x="${xr + 4}" y="${Tp - 10}" text-anchor="end" style="fill:var(--accent)">${HE ? "התוצאה" : "Result"}: ${AR.result}</text>`;
  const top = +Object.keys(AR.hist).find(k => AR.hist[k] === max);
  b += `<text x="${(L + (top - lo + .5) * bw).toFixed(1)}" y="${y(max) - 6}" text-anchor="middle" class="v">${max}</text>`;
  b += `<text x="${(L + W - Rr) / 2}" y="${H - 4}" text-anchor="middle">${HE ? "מנדטים לרשימות הערביות בסקר" : "Seats for the Arab lists in the poll"}</text>`;
  return `<h3>${HE ? `${fmt(AR.n)} סקרים, לפי מספר המנדטים שנתנו לרשימות הערביות` : `${fmt(AR.n)} polls, by the seats they gave the Arab lists`}</h3>
    <p class="sub">${HE ? "מספר הסקרים" : "Number of polls"} · ${dfmt(AR.from)} – ${dfmt("2026-10-23")}</p>` +
    svg(W, H, b, HE ? "היסטוגרמה של מנדטי הרשימות הערביות בסקרים" : "Histogram of the Arab lists' seats in the polls");
}

function figLikud(){
  const M = DATA.likud.months, W = 440, H = 240, L = 30, Rr = 44, Tp = 14, Bt = 30, lo = 16, hi = 36;
  const xs = i => L + (W - L - Rr) * i / (M.length - 1), y = v => Tp + (H - Tp - Bt) * (1 - (v - lo) / (hi - lo));
  let b = "";
  for (const t of [20, 25, 30, 35]) b += `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  const mo = s => new Intl.DateTimeFormat(HE ? "he-IL" : "en-GB", {month: "short"}).format(new Date(s + "-15T12:00:00Z"));
  M.forEach((m, i) => { b += `<text x="${xs(i)}" y="${H - Bt + 16}" text-anchor="middle">${esc(mo(m.month))}</text>`; });
  b += `<line class="axis" x1="${L}" x2="${W - Rr}" y1="${H - Bt}" y2="${H - Bt}"/>`;
  const yr = y(DATA.likud.result);
  b += `<line x1="${L}" x2="${W - Rr + 6}" y1="${yr}" y2="${yr}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  b += `<text class="lab" x="${xs(2)}" y="${yr - 6}" text-anchor="middle">${HE ? "התוצאה" : "Result"}: ${DATA.likud.result}</text>`;
  const line = (key, col) => `<polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" points="${M.map((m, i) => xs(i).toFixed(1) + "," + y(m[key]).toFixed(1)).join(" ")}"/>` +
    M.map((m, i) => `<circle cx="${xs(i).toFixed(1)}" cy="${y(m[key]).toFixed(1)}" r="4" fill="${col}" stroke="var(--paper)" stroke-width="2"/>`).join("");
  b += line("others", "var(--muted)") + line("panels", "var(--accent)");
  const last = M[M.length - 1];
  b += `<text class="v" x="${W - Rr + 10}" y="${y(last.panels) + 4}">${last.panels}</text><text class="v" x="${W - Rr + 10}" y="${y(last.others) + 4}">${last.others}</text>`;
  b += `<text class="lab" x="${xs(4)}" y="${y(M[4].panels) - 10}" text-anchor="middle">${HE ? "דיירקט פולס ופילבר" : "Direct Polls and Filber"}</text>`;
  b += `<text class="lab" x="${xs(3.5)}" y="${y(M[3].others) + 18}" text-anchor="middle">${HE ? "שאר הסוקרים" : "The rest"}</text>`;
  M.forEach((m, i) => { const w = (W - L - Rr) / (M.length - 1);
    b += `<rect class="hit" x="${(xs(i) - w / 2).toFixed(1)}" y="${Tp}" width="${w.toFixed(1)}" height="${H - Tp - Bt}"${tipAttr(`${mo(m.month)}: ${HE ? "דיירקט פולס ופילבר" : "Direct Polls and Filber"} ${m.panels} · ${HE ? "שאר הסוקרים" : "the rest"} ${m.others}`)}/>`; });
  return `<h3>${HE ? "הליכוד בסקרים, ממוצע חודשי" : "Likud in the polls, monthly average"}</h3><p class="sub">${HE ? "מנדטים" : "Seats"} · ${N(2026)}</p>` +
    svg(W, H, b, HE ? "הליכוד בסקרים לפי קבוצת סוקרים" : "Likud in the polls by pollster group") +
    `<div class="legend"><span><i class="a"></i>${HE ? "דיירקט פולס ופילבר" : "Direct Polls and Filber"}</span><span><i class="g"></i>${HE ? "שאר הסוקרים" : "The rest of the pollsters"}</span></div>`;
}

function figShas(){
  const S = DATA.shas, W = 440, H = 220, L = 34, Rr = 10, Tp = 22, Bt = 30, lo = -3, hi = 2.5;
  const bw = (W - L - Rr) / S.length, y = v => Tp + (H - Tp - Bt) * (1 - (v - lo) / (hi - lo)), y0 = y(0);
  const lab = c => HE ? ({"2019a": "אפר׳ 19", "2019s": "ספט׳ 19"}[c] || c) : ({"2019a": "Apr 19", "2019s": "Sep 19"}[c] || c);
  let b = "";
  for (const t of [-2, -1, 1, 2]) b += `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t > 0 ? "+" : "−"}${Math.abs(t)}</text>`;
  S.forEach((r, i) => { const x0 = L + i * bw + 5, w = bw - 10, top = Math.min(y0, y(r.err)), hgt = Math.abs(y(r.err) - y0), cur = r.cycle === "2026";
    b += `<rect x="${x0.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${hgt.toFixed(1)}" rx="3" fill="${cur ? "var(--accent)" : "var(--muted)"}"/>`;
    b += `<text class="v" x="${(x0 + w / 2).toFixed(1)}" y="${(r.err >= 0 ? top - 5 : top + hgt + 13).toFixed(1)}" text-anchor="middle">${sgn(r.err, 1)}</text>`;
    b += `<text x="${(x0 + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle"${cur ? ' class="v"' : ""}>${esc(lab(r.cycle))}</text>`;
    b += `<rect class="hit" x="${(L + i * bw).toFixed(1)}" y="${Tp}" width="${bw.toFixed(1)}" height="${H - Tp - Bt}"${tipAttr(`${lab(r.cycle)}: ${HE ? "הסקרים פחות התוצאה" : "polls minus result"} ${sgn(r.err, 1)}`)}/>`; });
  b += `<line class="axis" x1="${L}" x2="${W - Rr}" y1="${y0}" y2="${y0}"/>`;
  return `<h3>${HE ? "ש״ס: הסקרים האחרונים פחות התוצאה" : "Shas: final polls minus the result"}</h3><p class="sub">${HE ? "מנדטים. מתחת לקו: הסקרים נתנו פחות מדי." : "Seats. Below the line: the polls gave too few."}</p>` +
    svg(W, H, b, HE ? "טעות הסקרים בש״ס לפי מערכת בחירות" : "Shas polling error by election");
}

function figThreshold(){
  const max = 4, x = v => (100 * v / max).toFixed(2) + "%";
  const rows = [["די", HE ? "המילואימניקים והכלכלית" : "Reservists–Economic"], ["ך", HE ? "עמך ישראל" : "Amcha Yisrael"]].map(([l, name]) => {
    const w = R.wasted[l];
    return `<div class="row"${tipAttr(`${name}: ${w.share.toFixed(2)}% · ${fmt(w.votes)} ${HE ? "קולות" : "votes"}`)}><div class="lb">${esc(name)}<small>${N(fmt(w.votes))} ${HE ? "קולות" : "votes"}</small></div><div class="tr"><i class="bar" style="width:${x(w.share)}"></i><i class="tick" style="inset-inline-start:${x(3.25)}"></i></div><div class="vl">${N(w.share.toFixed(2) + "%")}</div></div>`;
  }).join("");
  return `<h3>${HE ? "חלק בקולות מול אחוז החסימה" : "Share of the vote against the threshold"}</h3><div class="rows">${rows}</div>
    <figcaption>${HE ? `הקו המקווקו: אחוז החסימה, ${N("3.25%")} (${N(fmt(R.threshold_votes))} קולות). הסולם: ${N("0–4%")}.` : `Dashed line: the threshold, ${N("3.25%")} (${N(fmt(R.threshold_votes))} votes). Scale: ${N("0–4%")}.`}</figcaption>
    <div class="stat"><div><b>${N(fmt(R.wasted_votes))}</b><span>${HE ? "קולות לשתי הרשימות" : "votes for the two lists"}</span></div><div><b>${N(R.wasted_share.toFixed(2) + "%")}</b><span>${HE ? "מהקולות הכשרים" : "of valid votes"}</span></div><div><b>${N(RK.res4 + "/" + RK.n)}</b><span>${HE ? "סקרים אחרונים שנתנו למילואימניקים 4 מנדטים" : "final polls with the Reservists at 4 seats"}</span></div></div>`;
}

function figRanking(){
  const max = Math.max(...RK.rows.map(r => r.err)), x = v => (100 * v / max).toFixed(2) + "%";
  const rows = RK.rows.map(r => {
    const nb = `${HE ? "גוש נתניהו" : "Netanyahu bloc"} ${sgn(r.nb)}`;
    return `<div class="row${r.kind === "model" ? " hl" : ""}"${tipAttr(`${outName(r)}: ${r.err} ${T.seats} · ${nb}`)}><div class="lb">${esc(outName(r))}</div><div class="tr"><i class="bar" style="width:${x(r.err)}"></i></div><div class="vl">${N(r.err)} <small>${N(sgn(r.nb))}</small></div></div>`;
  }).join("");
  return `<h3>${HE ? "מנדטים שהוחטאו, בכל הרשימות יחד" : "Seats missed, summed over all lists"}</h3><p class="sub">${HE ? "הסקר האחרון של כל גוף תקשורת, והמודל. המספר הקטן: הטעות בגוש נתניהו." : "Each outlet's last poll, and the model. Small figure: the error on the Netanyahu bloc."}</p><div class="rows">${rows}</div>`;
}

function figVariants(){
  const rows = SC.variants.map(v => `<div class="${v.id === "official" ? "hl" : ""}"><span>${N(v.rank)}</span><span>${esc(HE ? v.he : v.en)}</span><span>${N(v.log.toFixed(3))}</span></div>`).join("");
  return `<h3>${HE ? "אחת־עשרה הגרסאות, לפי ציון" : "The eleven versions, by score"}</h3><p class="sub">${HE ? "ציון לוגריתמי ממוצע לרשימה; קרוב יותר לאפס טוב יותר." : "Mean log score per list; closer to zero is better."}</p><div class="rank">${rows}</div>
    <div class="stat"><div><b>${N(COV[0] + "/" + COV[1])}</b><span>${HE ? "תוצאות בתוך טווחי ה־90%, תשע מערכות בחירות" : "results inside the 90% intervals, nine elections"}</span></div></div>`;
}

function figNight(){
  const P = DATA.night.concat([{pct: 100, nb: B.nb.seats26, arab: B.arab.seats26}]), W = 440, H = 230, L = 30, Rr = 14, Tp = 16, Bt = 34, lo = 50, hi = 68;
  const x = v => L + (W - L - Rr) * v / 100, y = v => Tp + (H - Tp - Bt) * (1 - (v - lo) / (hi - lo));
  let b = "";
  for (const t of [50, 55, 60, 65]) b += `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  for (const t of [0, 25, 50, 75, 100]) b += `<text x="${x(t)}" y="${H - Bt + 15}" text-anchor="middle">${t}%</text>`;
  b += `<line class="axis" x1="${L}" x2="${W - Rr}" y1="${H - Bt}" y2="${H - Bt}"/>`;
  b += `<line x1="${L}" x2="${W - Rr}" y1="${y(61)}" y2="${y(61)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="lab" x="${W - Rr}" y="${y(61) - 6}" text-anchor="end">${HE ? "רוב: 61" : "Majority: 61"}</text>`;
  const counted = P.slice(0, -1), fin = P[P.length - 1], lastC = counted[counted.length - 1];
  b += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="${counted.map(p => x(p.pct).toFixed(1) + "," + y(p.nb).toFixed(1)).join(" ")}"/>`;
  b += `<line x1="${x(lastC.pct)}" y1="${y(lastC.nb)}" x2="${x(fin.pct)}" y2="${y(fin.nb)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="2 5"/>`;
  P.forEach((p, i) => { const isFin = i === P.length - 1;
    b += `<circle cx="${x(p.pct).toFixed(1)}" cy="${y(p.nb).toFixed(1)}" r="${isFin ? 5 : 4}" fill="${isFin ? "var(--ink)" : "var(--accent)"}" stroke="var(--paper)" stroke-width="2"/>`;
    b += `<circle class="hit" cx="${x(p.pct).toFixed(1)}" cy="${y(p.nb).toFixed(1)}" r="13"${tipAttr(HE ? `${p.pct}% נספרו: גוש נתניהו ${p.nb}, הרשימות הערביות ${p.arab}` : `${p.pct}% counted: Netanyahu bloc ${p.nb}, Arab lists ${p.arab}`)}/>`; });
  b += `<text class="v" x="${x(counted[1].pct) + 8}" y="${y(counted[1].nb) - 6}">${counted[1].nb}</text>`;
  b += `<text class="lab" x="${x(100) - 2}" y="${y(fin.nb) + 18}" text-anchor="end">${HE ? "סופי" : "Final"}: ${fin.nb}</text>`;
  b += `<text x="${(L + W - Rr) / 2}" y="${H - 3}" text-anchor="middle">${HE ? "חלק הקולות שנספרו" : "Share of the vote counted"}</text>`;
  return `<h3>${HE ? "גוש נתניהו בספירה הגולמית, ליל הבחירות 2026" : "The Netanyahu bloc on the raw count, election night 2026"}</h3><p class="sub">${HE ? "מנדטים לפי הקולות שנספרו עד אותו רגע" : "Seats on the votes counted so far"}</p>` +
    svg(W, H, b, HE ? "מנדטי גוש נתניהו לאורך הספירה" : "Netanyahu-bloc seats through the count") +
    `<figcaption>${HE ? "הקו המנוקד: מהתמונה האחרונה ששמרנו בלילה ועד התוצאה הסופית." : "Dotted segment: from the last snapshot we kept that night to the final result."}</figcaption>`;
}

function figNext(){
  const order = Object.keys(PM).sort((a, b) => PM[b].p - PM[a].p).filter(k => PM[k].p >= 0.005);
  const max = Math.max(...order.map(k => PM[k].hi)), x = v => (100 * v / max).toFixed(2) + "%";
  const rows = order.map((k, i) => { const v = PM[k];
    return `<div class="row"${tipAttr(`${pmName(k)}: ${(100 * v.p).toFixed(0)}% (${(100 * v.lo).toFixed(0)}–${(100 * v.hi).toFixed(0)}%)`)}><div class="lb">${esc(pmName(k))}</div><div class="tr"><i class="band" style="inset-inline-start:${x(v.lo)};width:${x(v.hi - v.lo)}"></i><i class="bar" style="width:${x(v.p)}"></i></div><div class="vl">${pc(v.p)}</div></div>`; }).join("");
  return `<figure class="fig"><h3>${NEXT.figT}</h3><p class="sub">${NEXT.figS}</p><div class="rows">${rows}</div>
    <div class="legend"><span><i class="band"></i>${HE ? "טווח " + N("5%–95%") : N("5%–95%") + " range"}</span></div><figcaption>${NEXT.figC}</figcaption></figure>`;
}

function ledger(){
  const by = {}; NX.ledger.forEach(e => (by[e.param] = by[e.param] || []).push(e));
  let h = `<table class="t"><thead><tr><th>${NEXT.thDate}</th><th>${NEXT.thWhat}</th><th>${NEXT.thDir}</th><th>${NEXT.thSrc}</th></tr></thead><tbody>`;
  for (const k of PAR_ORDER) { if (!by[k]) continue; const v = NX.parameters[k];
    h += `<tr class="grp"><td colspan="4">${esc(PAR[k][HE ? 1 : 0])}: ${pc(v.prior)} → ${pc(v.posterior)}</td></tr>`;
    for (const e of by[k].sort((a, b) => a.date < b.date ? -1 : 1)) {
      const host = e.url.replace(/^https?:\/\/(www\.)?/, "").split("/")[0];
      h += `<tr><td>${dfmt(e.date)}</td><td>${esc(HE ? e.he : e.en)}</td><td class="dir ${e.dir > 0 ? "up" : "dn"}">${e.dir > 0 ? "↑" : "↓"} ${e.dir > 0 ? NEXT.up : NEXT.dn} · ${NEXT.str[e.strength]}</td><td>${A(e.url, `<span class="ltr">${esc(host)}</span>`)}</td></tr>`; } }
  return h + "</tbody></table>";
}

const FIGS = {blocs: figBlocs, arab: figArab, likud: figLikud, shas: figShas, threshold: figThreshold, ranking: figRanking, variants: figVariants, night: figNight};

function render(){
  document.title = T.title;
  $("brand").textContent = T.brand; $("tagline").textContent = T.tagline; $("skip").textContent = T.skip;
  $("e-open").textContent = T.eOpen; $("h1").innerHTML = T.h1; $("lede").innerHTML = T.lede;
  $("dateline").innerHTML = `${T.asof} <b>${dfmt(DATA.as_of)}</b>`;
  const seg = [["nb", T.stripNb, false], ["anti", T.stripAnti, true], ["arab", T.stripArab, false]];
  $("strip").innerHTML = `<div class="labs">${seg.map(([k, name]) => `<div style="flex:${B[k].seats26} 1 0"><b>${B[k].seats26}</b><span>${esc(name)}</span></div>`).join("")}</div>
    <div class="segs" role="img" aria-label="${esc(seg.map(([k, name]) => name + " " + B[k].seats26).join(", "))}">${seg.map(([k, , hollow]) => `<i class="${hollow ? "hollow" : ""}" style="flex:${B[k].seats26} 1 0"></i>`).join("")}<span class="mark" style="inset-inline-start:${(100 * 61 / 120).toFixed(2)}%"></span></div>
    <div class="cap"><span>${T.stripCap} ${A(URLS.cec26, HE ? "ועדת הבחירות המרכזית" : "Central Elections Committee")}</span><span>${T.stripTurn}</span></div>`;
  const all = INS.concat([NEXT]);
  $("toc").innerHTML = all.map((s, i) => `<a href="#${s.id}">${N(i + 1)} ${esc(s.nav)}</a>`).join("");
  let h = "";
  INS.forEach((s, i) => {
    const body = (s.list ? `<ul>${s.list.map(x => `<li>${x}</li>`).join("")}</ul>` : "") + s.p.map(x => `<p>${x}</p>`).join("");
    const src = s.src.length ? `<p class="src">${T.sources}: ${s.src.join(" · ")}</p>` : "";
    const fig = FIGS[s.id] ? `<figure class="fig">${FIGS[s.id]()}</figure>` : "";
    h += `<article class="ins${fig ? "" : " wide"}" id="${s.id}"><div class="num">${i + 1}</div><div class="txt"><h2>${s.h}</h2>${body}${src}</div>${fig}</article>`;
  });
  const tl = NX.timeline.map(t => `<li><b>${dfmt(t.date)}</b><span>${esc(HE ? t.he : t.en)}</span></li>`).join("");
  h += `<article class="ins wide" id="next"><div class="num">${INS.length + 1}</div><div class="txt"><h2>${NEXT.h}</h2>${NEXT.p.map(x => `<p>${x}</p>`).join("")}
    <div class="next"><div class="cols"><div>${figNext()}<p>${NEXT.mk}</p></div>
      <div><p class="k">${NEXT.moveT}</p><ul>${NEXT.move.map(x => `<li>${x}</li>`).join("")}</ul><p class="k" style="margin-top:18px">${NEXT.tlT}</p><ul class="tl">${tl}</ul></div></div>
      <details><summary>${NEXT.ledT}</summary><p style="font-size:13px;color:var(--muted)">${NEXT.ledS}</p><div class="tw">${ledger()}</div></details>
      <p class="honest">${NEXT.honest}</p></div>
    <p class="src">${T.sources}: ${NEXT.src.join(" · ")}</p></div></article>`;
  $("list").innerHTML = h;
  $("after").innerHTML = `<h2>${AFTER.h}</h2><ul>${AFTER.li.map(x => `<li>${x}</li>`).join("")}</ul>`;
  $("foot-l").textContent = T.footL;
  $("foot-r").innerHTML = `<a href="index.html">${T.back}</a> · <a href="scorecard.html">${T.score}</a> · <a href="election-night.html">${T.night}</a> · <a href="decision-log.html">${T.log}</a>`;
  const lb = $("langbtn"); lb.textContent = T.lang;
  lb.onclick = () => { try { localStorage.setItem("klang", HE ? "en" : "he"); } catch (e) {}
    const u = new URL(location.href); u.searchParams.delete("lang"); location.href = u.toString(); };
  const tb = $("themebtn");
  const eff = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  try { const s = localStorage.getItem("ktheme"); if (s === "light" || s === "dark") { document.documentElement.dataset.theme = s; document.documentElement.style.colorScheme = s; } } catch (e) {}
  const lab = () => { tb.textContent = eff() === "dark" ? T.light : T.dark; };
  lab();
  tb.onclick = () => { const n = eff() === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n;
    document.documentElement.style.colorScheme = n; try { localStorage.setItem("ktheme", n); } catch (e) {} lab(); };
  /* hover and focus tooltips for every mark that carries data-tip */
  const tip = $("tip");
  const show = (el, ev) => { tip.textContent = el.dataset.tip; tip.classList.add("on");
    const r = el.getBoundingClientRect(), px = ev && ev.clientX != null ? ev.clientX : r.left + r.width / 2, py = ev && ev.clientY != null ? ev.clientY : r.top;
    const w = tip.offsetWidth, hh = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, px - w / 2)) + "px"; tip.style.top = Math.max(8, py - hh - 14) + "px"; };
  document.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mousemove", e => show(el, e)); el.addEventListener("mouseleave", () => tip.classList.remove("on"));
    el.addEventListener("focus", () => show(el)); el.addEventListener("blur", () => tip.classList.remove("on")); });
}
render();
</script>
</body>
</html>
