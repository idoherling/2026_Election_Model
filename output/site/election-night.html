*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font:400 16px/1.55 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body,html[dir="rtl"] h1,html[dir="rtl"] h2{font-family:"IBM Plex Sans Hebrew","IBM Plex Sans",sans-serif;letter-spacing:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
h1,h2,h3{line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance}
.mono,.n,.num{font-family:"IBM Plex Mono","IBM Plex Sans Hebrew",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.n,.ltr{direction:ltr;unicode-bidi:isolate}
a{color:var(--ink);text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;inset-inline-start:8px;top:8px;z-index:100;background:var(--ink);color:var(--paper);padding:10px 14px;font-weight:700;text-decoration:none;clip-path:inset(50%);white-space:nowrap}
.skip:focus{clip-path:none}
button{font:inherit}
/* masthead, as on the main site */
.masthead{border-top:14px solid var(--ink);border-bottom:3px solid var(--ink);padding:18px 0 14px}
.masthead .wrap{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand{font-weight:700;font-size:22px;letter-spacing:-.01em;text-transform:uppercase}
.brand a{text-decoration:none}
.brand small{font-weight:500;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.22em;display:block;margin-top:4px}
html[dir="rtl"] .brand small{letter-spacing:.04em}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl button{border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 12px "IBM Plex Sans Hebrew","IBM Plex Sans",sans-serif;padding:7px 14px;cursor:pointer;letter-spacing:.06em;min-height:36px}
.dateline{font:500 11.5px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;text-align:end}
html[dir="rtl"] .dateline{letter-spacing:.02em}
.dateline b{color:var(--ink);font-weight:600}
.eyebrow{font:700 11px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
html[dir="rtl"] .eyebrow{letter-spacing:.03em}
section{padding:30px 0 6px}
section > h2{font-size:clamp(22px,3.2vw,30px);margin-bottom:6px}
.lede{color:var(--ink2);max-width:62ch;margin:6px 0 16px;font-size:15px}
.banner{margin:18px 0 0;border:3px solid var(--ink);padding:12px 16px;font-size:14.5px;background:var(--hit)}
.banner b{font-weight:700}
.banner.rehearsal{border-color:var(--accent)}
.banner.stale{border-color:var(--warn)}
.banner.stale b{color:var(--warn)}
/* status strip */
.status{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;border-bottom:2px solid var(--ink);margin-top:22px}
.stat{padding:14px 16px 14px 0;border-inline-end:1px solid var(--hit)}
.stat:last-child{border-inline-end:0}
html[dir="rtl"] .stat{padding:14px 0 14px 16px}
.stat .k{font:700 10.5px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
html[dir="rtl"] .stat .k{letter-spacing:.02em}
.stat .v{font:600 clamp(30px,5.4vw,52px)/1 "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.stat .v.sm{font-size:clamp(22px,3.4vw,30px)}
.stat .s{font-size:12.5px;color:var(--muted);line-height:1.45}
.meter{height:8px;background:var(--hit);margin-top:8px;position:relative;direction:ltr}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
/* blocs */
.blocs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:3px solid var(--ink)}
.bloc{padding:14px 14px 16px 0;border-inline-end:1px solid var(--hit)}
html[dir="rtl"] .bloc{padding:14px 0 16px 14px}
.bloc:last-child{border-inline-end:0}
.bloc .k{font:700 11px "IBM Plex Sans","IBM Plex Sans Hebrew",sans-serif;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:6px;align-items:center;min-height:30px}
html[dir="rtl"] .bloc .k{letter-spacing:0}
.bloc .k i{width:10px;height:10px;display:inline-block;flex:none}
.bloc .big{font:600 clamp(34px,5vw,50px)/1 "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.bloc .big small{font-size:12px;font-weight:500;color:var(--muted);margin-inline-start:6px;letter-spacing:.04em}
.bloc .adj{font-size:13px;color:var(--ink2)}
.bloc .ref{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.bloc .sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.btrack{position:relative;height:16px;margin-top:10px;direction:ltr}
.btrack .base{position:absolute;left:0;right:0;top:7px;height:2px;background:var(--hit)}
.btrack .band{position:absolute;top:4px;height:8px;background:var(--hit);outline:1px solid var(--muted)}
.btrack .maj{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.btrack .dot{position:absolute;top:3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--pc,var(--ink))}
.btrack .ring{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--pc,var(--ink));background:var(--paper)}
/* flags */
.flag{font:600 10.5px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
html[dir="rtl"] .flag{letter-spacing:0}
.flag.in{color:var(--ok)}
.flag.out{color:var(--warn)}
.flag.na{color:var(--muted)}
/* seat table */
.sheet{border-top:3px solid var(--ink)}
.shead,.srow{display:grid;grid-template-columns:48px minmax(0,1.5fr) 74px 74px minmax(150px,1.6fr) 96px;gap:0 12px;align-items:center}
.shead{font:700 10px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:10px 0 8px;border-bottom:2px solid var(--ink);align-items:end}
html[dir="rtl"] .shead{letter-spacing:0}
.srow{padding:9px 0;border-bottom:1px solid var(--hit)}
.srow.zero .nm b{color:var(--ink2)}
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:28px;padding:0 5px;border:2px solid var(--pc,var(--dead));font:700 14px "IBM Plex Sans Hebrew",sans-serif;direction:rtl;color:var(--ink)}
.nm b{font-weight:600;font-size:15px;display:block;line-height:1.25}
.nm small{font-size:12px;color:var(--muted)}
.sv{font:600 22px/1 "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;text-align:center;font-variant-numeric:tabular-nums}
.sv.adj{font-weight:500;color:var(--ink2);font-size:19px}
.sv .of{display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.trk{position:relative;height:22px;direction:ltr}
.trk .axis{position:absolute;left:0;right:0;top:10px;height:1px;background:var(--hit)}
.trk .band{position:absolute;top:6px;height:10px;background:var(--hit);outline:1px solid var(--muted)}
.trk .ctr{position:absolute;top:3px;width:2px;height:16px;margin-left:-1px;background:var(--muted)}
.trk .dot{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--pc,var(--ink))}
.trk .ring{position:absolute;top:4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid var(--ink);background:transparent}
.trk .off{position:absolute;top:2px;width:2px;height:18px;margin-left:-1px;background:var(--ink)}
.ivlab{font-size:11.5px;color:var(--muted);margin-top:1px}
.fl{text-align:end;line-height:1.35}
.smallrow{padding:10px 0;border-bottom:1px solid var(--hit);font-size:13.5px;color:var(--ink2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink2);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block}
.lg-dot{width:11px;height:11px;border-radius:50%;background:var(--ink)}
.lg-ring{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.lg-band{width:22px;height:9px;background:var(--hit);outline:1px solid var(--muted)}
.lg-ctr{width:2px;height:14px;background:var(--muted)}
/* tables */
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{font:700 10px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.1em;text-transform:uppercase;text-align:start;color:var(--ink2);padding:8px 10px 8px 0;border-bottom:2px solid var(--ink);vertical-align:bottom}
html[dir="rtl"] table.t th{letter-spacing:0;padding:8px 0 8px 10px}
table.t td{padding:9px 10px 9px 0;border-bottom:1px solid var(--hit);vertical-align:top}
html[dir="rtl"] table.t td{padding:9px 0 9px 10px}
table.t td.num{font-family:"IBM Plex Mono","IBM Plex Sans Hebrew",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--ok)} .neg{color:var(--warn)}
.why{font-size:12.5px;color:var(--ink2);max-width:46ch}
.why a{color:var(--accent)}
.sbar{height:6px;background:var(--hit);position:relative;min-width:60px;direction:ltr;margin-top:6px}
.sbar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.empty{font-size:14px;color:var(--muted);padding:12px 0;border-bottom:1px solid var(--hit)}
.method ul{margin:8px 0 0;padding-inline-start:20px;max-width:78ch}
.method li{margin:6px 0;font-size:14px;color:var(--ink2)}
.method li b{color:var(--ink)}
.pairs{font-size:13.5px;color:var(--ink2);margin-top:12px}
.pairs .pr{display:inline-flex;gap:4px;align-items:center;margin-inline-end:12px;white-space:nowrap}
.pairs .pr .lt{min-width:30px;height:22px;font-size:12px}
footer{border-top:14px solid var(--ink);margin-top:46px;padding:22px 0 44px;font-size:12.5px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media (max-width:900px){
  .status{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-inline-end:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--hit)}
  .blocs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bloc{border-bottom:1px solid var(--hit)}
  .bloc:nth-child(2n){border-inline-end:0}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .masthead .wrap{align-items:flex-start}
  .dateline{text-align:start}
  .shead,.srow{grid-template-columns:40px minmax(0,1fr) 40px 40px;gap:4px 8px}
  .shead .h-ivl,.shead .h-fl,.shead .hw{display:none}
  .srow .ivl{grid-column:2 / 5}
  .srow .fl{grid-column:2 / 5;text-align:start}
  .lt{min-width:34px;font-size:13px}
  .sv{font-size:19px} .sv.adj{font-size:16px}
  .nm b{font-size:14px}
  table.t.watch thead{display:none}
  table.t.watch tr{display:block;border-bottom:1px solid var(--hit);padding:8px 0}
  table.t.watch td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0}
  table.t.watch td::before{content:attr(data-label);font:700 10px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  table.t.watch td.why{display:block}
  table.t.watch td.why::before{display:block;margin-bottom:2px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@media print{.ctl,.skip{display:none !important} body{background:#fff;color:#000}}
</style>

    `<b>(ב) תיקון לפי מגזר.</b> לכל יישוב יש מספר צפוי של קולות כשרים: הקולות שלו בבחירות הקודמות × גידול פנקס הבוחרים (${d.method.growth && d.method.growth.arab ? `יישובים ערביים ${pct(d.method.growth.arab - 1)}, האחרים ` : ""}${pct(d.method.growth ? d.method.growth._other - 1 : null)}) × מקדם שיעור ההצבעה הערבי של התחזית (${num(d.method.arab_turnout_factor, 3)}). היתרה שטרם נספרה מחולקת לפי התוצאה של היישוב עצמו, מכווצת (משקל ${N(fmt(d.method.k_local))} קולות) לעבר תחזית: ההרכב הצפוי של היישוב כפול התנודה היחסית של המגזר שלו. ההרכב הצפוי הוא ${d.cycle === "2022" ? "תוצאת היישוב ב־2021, מועברת לרשימות של 2022" : "תוצאת היישוב ב־2022, מועברת לרשימות של 2026 לפי שושלות הרשימות ולפי שיעורי התחזית הארציים"}. התנודה היא הקולות שנספרו חלקי הקולות הצפויים ביישובים שכבר דיווחו באותו מגזר, מכווצת לעבר אפס תנודה (${N(fmt(d.method.k_sector))} קולות). כך יישוב שטרם דיווח, כמו יישובי הנגב של רע״ם ב־2022, לא מקבל את ההרכב של יישובים אחרים במגזר.`,
    `<b>המעטפות הכפולות</b> (חיילים, בתי חולים, בתי סוהר, נציגויות) נספרות אחרונות, בימים שאחרי הבחירות. מאגר המעטפות הצפוי נקבע לפי חלקו בבחירות הקודמות. עד שהן נספרות הוא מחולק לפי השיעורים המתוקנים של הקלפיות הרגילות, בלי הטיה. ההטיה לפי רשימה <b>לא</b> מחושבת במספרים; מעקב אחוז החסימה מציין רק את הכיוון <span class="ltr">(<a href="${d.trn_f03.url}">${d.trn_f03.id}</a>, ${d.trn_f03.cite})</span>. לפי IDI, ההשפעה על הגושים זניחה, למעט דרך אחוז החסימה.`,
    `<b>מה לא מחושב:</b> רווחי אי־ודאות סביב (ב); הטיה בסדר הדיווח בין הקלפיות של אותו יישוב; שינויי שיעור הצבעה לפי מגזר מלבד המקדם הערבי; יישובים שלא היו בבחירות הקודמות (נכנסים רק במה שדיווחו). כשיש רק טבלה ארצית (העמוד הארצי או הזנה ידנית), (ב) לא מחושב.`,
    `<b>אחוז הספירה</b> הוא הערכה: הקולות שנספרו חלקי הקולות הצפויים. מספר הקלפיות שדיווחו מדויק (מתוך ${N(fmt(d.progress.stations_expected))} קלפיות רגילות${d.cycle === "2026" ? ", " + N("TRN-F01") : ""}).`
  ]
} : {

  colList: "List", colA: "(a)<span class=\"hw\"> Count</span>", colB: "(b)<span class=\"hw\"> Adjusted</span>", colIvl: "Against the forecast (90% interval)", colFlag: "Inside?",

  secCounted: "Counted", secExpected: "Expected", secPct: "Counted %", secLoc: "Localities reporting", sectorsNone: "This count has no station or locality detail, so adjustment (b) is not computed. Only (a) and the threshold margins are shown.",

  sector: {centre_left: "Centre-left localities", mixed: "Mixed cities", secular_right: "Secular-right localities", arab: "Arab localities", haredi: "Haredi localities", religious_zionist: "Religious-Zionist localities", russian_leaning: "Druze & YB strongholds", unknown: "New localities", envelopes: "Double envelopes"},

    `<b>(b) The sector adjustment.</b> Each locality has an expected valid vote: its vote at the previous election × register growth (${d.method.growth && d.method.growth.arab ? `Arab localities ${pct(d.method.growth.arab - 1)}, others ` : ""}${pct(d.method.growth ? d.method.growth._other - 1 : null)}) × the forecast's Arab turnout factor (${num(d.method.arab_turnout_factor, 3)}). The part not yet counted is cast at the locality's own result, shrunk (weight ${N(fmt(d.method.k_local))} votes) toward a prediction: the locality's expected make-up times its sector's ratio swing. The expected make-up is ${d.cycle === "2022" ? "the locality's 2021 result carried to the 2022 lists" : "the locality's 2022 result carried to the 2026 lists through their lineages, at the forecast's national shares"}. The swing is counted over expected votes in the sector's reported localities, shrunk to no swing (${N(fmt(d.method.k_sector))} votes). So a locality that has not reported, like Ra'am's Negev towns in 2022, does not inherit the rest of its sector's make-up.`,

const nf = new Intl.NumberFormat("en-US");
const N = x => `<span class="n">${x}</span>`;
const fmt = x => x == null ? "–" : nf.format(Math.round(x));
const num = (x, d) => x == null ? "–" : N(Number(x).toFixed(d));
const pct = (x, d = 1) => x == null ? "–" : N((x * 100).toFixed(d) + "%");
const pp = (x, d = 2) => x == null ? "–" : N(Number(x).toFixed(d) + "%");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const $ = id => document.getElementById(id);
const tfmt = iso => { if (!iso) return "–"; const d = new Date(iso); if (isNaN(d)) return esc(iso);
  return "<bdi>" + new Intl.DateTimeFormat(HE ? "he-IL" : "en-GB", {timeZone: "Asia/Jerusalem", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}).format(d) + "</bdi>"; };
const nm = r => esc(HE ? r.he : r.en);
const pcv = p => p ? `--pc:var(--p-${p})` : "--pc:var(--dead)";
const BLOC_VAR = {nb: "--bloc-nb", anti: "--bloc-anti", antiRaam: "--bloc-anti", arab: "--bloc-arab", una: "--bloc-una"};
const flagHtml = (x, ref) => { if (x == null || !ref || ref.lo == null) return `<span class="flag na">${T.na}</span>`;
  if (x >= ref.lo && x <= ref.hi) return `<span class="flag in">${T.inside}</span>`;
  return `<span class="flag out">${T.outside} ${x > ref.hi ? "↑" : "↓"}</span>`; };

function renderStatic(){
  document.title = T.title;
  $("brand").textContent = T.brand; $("tagline").textContent = T.tagline; $("skip").textContent = T.skip;
  $("e-blocs").textContent = T.eBlocs; $("h-blocs").textContent = T.hBlocs; $("l-blocs").textContent = T.lBlocs;
  $("e-seats").textContent = T.eSeats; $("h-seats").textContent = T.hSeats; $("l-seats").textContent = T.lSeats;
  $("e-watch").textContent = T.eWatch; $("h-watch").textContent = T.hWatch; $("l-watch").textContent = T.lWatch;
  $("e-sectors").textContent = T.eSectors; $("h-sectors").textContent = T.hSectors; $("l-sectors").textContent = T.lSectors;
  $("e-method").textContent = T.eMethod; $("h-method").textContent = T.hMethod;
  const lb = $("langbtn"); lb.textContent = T.lang;
  lb.onclick = () => { try { localStorage.setItem("klang", HE ? "en" : "he"); } catch (e) {}
    const u = new URL(location.href); u.searchParams.delete("lang"); location.href = u.toString(); };
  const tb = $("themebtn");
  const eff = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  try { const s = localStorage.getItem("ktheme"); if (s === "light" || s === "dark") { document.documentElement.dataset.theme = s; document.documentElement.style.colorScheme = s; } } catch (e) {}
  const lab = () => { tb.textContent = eff() === "dark" ? T.light : T.dark; };
  lab();
  tb.onclick = () => { const n = eff() === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n;
    document.documentElement.style.colorScheme = n; try { localStorage.setItem("ktheme", n); } catch (e) {} lab(); };
}

function renderBanner(d){
  let h = "";
  if (d.mode === "rehearsal" && d.replay) {
    h += `<div class="banner rehearsal"><b>${T.rehearsal}: ${T.rehearsalTxt}</b> · ${T.step} ${N(d.replay.step + "/" + d.replay.of)} · ${esc(HE && d.replay.label_he ? d.replay.label_he : d.replay.label)}<br>${T.rehearsalNote}</div>`;
  }
  if (d.mode === "waiting") {
    const lv = HE ? {station: "קובץ הקלפיות", locality: "קובץ היישובים", national: "העמוד הארצי"}
      : {station: "station file", locality: "locality file", national: "national page"};
    const c = (d.source.check || []).map(x => `${lv[x.level] || esc(x.level)} ${x.status == null ? "–" : N(x.status)}`).join(" · ");
    h += `<div class="banner"><b>${T.waiting}</b> ${T.waitingTxt}${c ? ` (${c}; ${T.checked} ${tfmt(d.generated_utc)})` : ""}. ${T.forecastBelow}</div>`;
  }
  if (d.stale) {
    h += `<div class="banner stale"><b>${T.stale}</b> (${tfmt(d.stale.since)}): ${esc(d.stale.problem)}. ${d.stale.showing ? T.staleShowing + tfmt(d.stale.showing) + "." : T.staleNone}</div>`;
  }
  $("banner").innerHTML = h;
}

function renderStatus(d){
  const p = d.progress, live = d.mode !== "waiting";
  const lvl = {station: T.sLevelStation, locality: T.sLevelLocality, national: T.sLevelNational, manual: T.sLevelManual}[d.source.level] || "";
  const pv = p.manual_pct != null ? p.manual_pct / 100 : p.pct_votes;
  const extra = p.cec_pct != null ? `<br>${pp(p.cec_pct, 1)} ${T.sCec}` : (p.manual_pct != null ? `<br>${T.sManual}` : "");
  const st = p.stations != null ? `<div class="v sm">${N(fmt(p.stations))}</div><div class="s">${T.sStationsSub} ${N(fmt(p.stations_expected))}</div>`
    : `<div class="v sm">–</div><div class="s">${lvl}</div>`;
  const envC = p.envelope_valid || 0;
  const env = envC > 0 ? `<div class="v sm">${pct(p.envelope_expected ? envC / p.envelope_expected : null, 0)}</div><div class="s">${N(fmt(envC))} ${T.sEnvCounted} ${N(fmt(p.envelope_expected))}</div>`
    : `<div class="v sm">${T.sEnvNone}</div><div class="s">${T.sEnvSub}</div>`;
  $("status").innerHTML =
    `<div class="stat"><div class="k">${T.sCounted}</div><div class="v">${live ? pct(pv, 1) : "–"}</div><div class="s">${T.sCountedSub}${extra}</div>${live && pv != null ? `<div class="meter"><i style="width:${Math.min(100, pv * 100).toFixed(1)}%"></i></div>` : ""}</div>` +
    `<div class="stat"><div class="k">${T.sStations}</div>${st}</div>` +
    `<div class="stat"><div class="k">${T.sEnv}</div>${env}</div>` +
    `<div class="stat"><div class="k">${T.sValid}</div><div class="v sm">${live ? N(fmt(p.valid)) : "–"}</div><div class="s">${T.sValidSub}${lvl ? " · " + lvl : ""}</div></div>`;
  $("dateline").innerHTML = (live ? `${T.countAsOf}<b>${tfmt(d.fetched_utc)}</b>` : `${T.generated} <b>${tfmt(d.generated_utc)}</b>`) + ` · ${T.israelTime}<br><span id="autostat"></span>`;
}

function blocTrack(b, color){
  const x = v => (100 * v / 120).toFixed(2) + "%";
  let h = `<div class="btrack" style="--pc:var(${color})"><i class="base"></i>`;
  if (b.ref && b.ref.lo != null) h += `<i class="band" style="left:${x(b.ref.lo)};width:${x(b.ref.hi - b.ref.lo)}"></i>`;
  h += `<i class="maj" style="left:${x(61)}"></i>`;
  if (b.adj != null) h += `<i class="ring" style="left:${x(b.adj)}"></i>`;
  if (b.raw != null) h += `<i class="dot" style="left:${x(b.raw)}"></i>`;
  return h + "</div>";
}

function renderBlocs(d){
  const sub = {anti: T.antiSub, antiRaam: T.antiRaamSub, una: d.cycle === "2026" ? T.unaSub : ""};
  $("blocs").innerHTML = d.blocs.map(b => {
    const r = b.ref || {};
    const refTxt = r.central != null ? `${d.reference && d.reference.kind === "harness" ? T.fc : T.fc}: ${N(r.central)}${r.lo != null ? ` [${N(r.lo + "–" + r.hi)}]` : ""}${r.p61 != null ? ` · ${T.p61} ${pct(r.p61, 0)}` : ""}${r.official != null ? `<br>${T.official}: ${N(r.official)}` : ""}` : "";
    const fl = b.raw != null && r.lo != null ? " " + flagHtml(b.raw, r) : "";
    return `<div class="bloc"><div class="k"><i style="background:var(${BLOC_VAR[b.key]})"></i>${T[b.key]}</div>` +
      `<div class="big">${b.raw == null ? "–" : N(b.raw)}<small>${T.seatsNow}</small></div>` +
      `<div class="adj">${b.adj == null ? "" : `${T.adjusted}: ${N(b.adj)}`}${fl}</div>` +
      blocTrack(b, BLOC_VAR[b.key]) + `<div class="ref">${refTxt}</div>` + (sub[b.key] ? `<div class="sub">${sub[b.key]}</div>` : "") + `</div>`;
  }).join("");
}

function renderSeats(d){
  $("shead").innerHTML = `<div></div><div>${T.colList}</div><div style="text-align:center">${T.colA}</div><div style="text-align:center">${T.colB}</div><div class="h-ivl">${T.colIvl}</div><div class="h-fl" style="text-align:end">${T.colFlag}</div>`;
  let mx = 10;
  d.lists.forEach(r => { mx = Math.max(mx, r.seats_raw || 0, r.seats_adj || 0, r.ref ? r.ref.hi || 0 : 0, r.official || 0); });
  mx = Math.ceil((mx + 2) / 5) * 5;
  const x = v => (100 * v / mx).toFixed(2) + "%";
  const live = d.mode !== "waiting";
  $("srows").innerHTML = d.lists.map(r => {
    const ref = r.ref;
    let trk = `<div class="trk" style="${pcv(r.pvar)}"><i class="axis"></i>`;
    if (ref && ref.lo != null) trk += `<i class="band" style="left:${x(ref.lo)};width:${x(Math.max(ref.hi - ref.lo, 0.15))}"></i><i class="ctr" style="left:${x(ref.seats)}"></i>`;
    if (r.official != null) trk += `<i class="off" style="left:${x(r.official)}"></i>`;
    if (live && r.seats_adj != null) trk += `<i class="ring" style="left:${x(r.seats_adj)}"></i>`;
    if (live && r.seats_raw != null) trk += `<i class="dot" style="left:${x(r.seats_raw)}"></i>`;
    trk += `</div>`;
    const lab = ref ? `<div class="ivlab">${T.fc} ${N(ref.seats)} [${N(ref.lo + "–" + ref.hi)}]${ref.p_pass != null && ref.p_pass < 0.995 ? ` · ${HE ? "סיכוי לעבור" : "pass"} ${pct(ref.p_pass, 0)}` : ""}${r.official != null ? ` · ${T.official} ${N(r.official)}` : ""}</div>` : `<div class="ivlab">${T.na}</div>`;
    const sub = live && r.votes != null ? `${N(fmt(r.votes))} · ${pp(r.share * 100, 2)}` : "";
    const fl = live ? flagHtml(r.seats_raw, ref) + (r.seats_adj != null && ref ? `<br><span class="flag na">${T.adjShort}</span> ${flagHtml(r.seats_adj, ref)}` : "") : `<span class="flag na">–</span>`;
    const zero = !(r.seats_raw > 0 || r.seats_adj > 0) ? " zero" : "";
    return `<div class="srow${zero}"><div><span class="lt" style="${pcv(r.pvar)}">${esc(r.letter)}</span></div>` +
      `<div class="nm"><b>${nm(r)}</b><small>${sub}</small></div>` +
      `<div class="sv">${live && r.seats_raw != null ? N(r.seats_raw) : "–"}</div>` +
      `<div class="sv adj">${live && r.seats_adj != null ? N(r.seats_adj) : "–"}</div>` +
      `<div class="ivl">${trk}${lab}</div><div class="fl">${fl}</div></div>`;
  }).join("") + (live && d.small && d.small.votes ? `<div class="smallrow">${T.smallTxt(N(d.small.n), N(fmt(d.small.votes)), pct(d.small.share, 2))}</div>` : "");
  $("legend").innerHTML = `<span><i class="lg-dot"></i>${T.lgDot}</span><span><i class="lg-ring"></i>${T.lgRing}</span><span><i class="lg-band"></i>${T.lgBand}</span><span><i class="lg-ctr"></i>${T.lgCtr}</span>` + (d.reference && d.reference.kind === "harness" ? `<span><i class="lg-ctr" style="background:var(--ink)"></i>${T.lgOff}</span>` : "") + (d.reference && d.reference.label ? `<span>· ${esc(HE ? d.reference.label.he : d.reference.label.en)}</span>` : "");
  const byL = {}; d.lists.forEach(r => byL[r.letter] = r);
  const chip = l => `<span class="lt" style="${pcv(byL[l] && byL[l].pvar)}">${esc(l)}</span>`;
  $("pairs").innerHTML = `<b>${T.pairs}:</b> ` + (d.pairs.length ? d.pairs.map(p => `<span class="pr">${chip(p.a)}+${chip(p.b)}${live ? ` <span class="flag ${p.pooled_raw ? "in" : "na"}">${p.pooled_raw ? T.pooledYes : T.pooledNo}</span>` : ""}</span>`).join("") : T.pairsNone) +
    (d.pairs_unresolved && d.pairs_unresolved.length ? `<br>${T.unresolved} ${d.pairs_unresolved.map(p => esc(p.join("–"))).join(", ")}` : "");
}

function leanTxt(w, d){
  const env = d.progress.envelope_valid > 0;
  let t = w.lean ? (T.lean[w.lean.family] || {})[w.lean.basis] : T.lean.none;
  if (!t) t = T.lean.none;
  return `${t} <a href="${d.trn_f03.url}">${N(d.trn_f03.id)}</a>${env ? `<br><i>${T.envDone}</i>` : ""}`;
}

function renderWatch(d){
  if (d.mode === "waiting" || !d.watch.length) { $("watchbox").innerHTML = `<div class="empty">${d.mode === "waiting" ? "–" : T.watchNone}</div>`; return; }
  const m = v => v == null ? "–" : `<span class="${v >= 0 ? "pos" : "neg"}">${N((v >= 0 ? "+" : "−") + fmt(Math.abs(v)))}</span>`;
  $("watchbox").innerHTML = `<table class="t watch"><thead><tr><th>${T.wList}</th><th>${T.wShare}</th><th>${T.wMargin}</th><th>${T.wAdj}</th><th>${T.wEnv}</th></tr></thead><tbody>` +
    d.watch.map(w => `<tr><td data-label="${T.wList}"><span><span class="lt" style="${pcv(w.pvar)};min-width:32px;height:24px;font-size:12px">${esc(w.letter)}</span> <b>${esc(HE ? w.he : w.en)}</b></span></td>` +
      `<td class="num" data-label="${T.wShare}"><span>${pp(w.share, 2)} <span class="flag ${w.passes ? "in" : "out"}">${w.passes ? T.passes : T.fails}</span></span></td>` +
      `<td class="num" data-label="${T.wMargin}">${m(w.margin)}</td>` +
      `<td class="num" data-label="${T.wAdj}"><span>${w.share_adj == null ? "–" : pp(w.share_adj, 2) + " · " + m(w.margin_adj)}</span></td>` +
      `<td class="why" data-label="${T.wEnv}">${leanTxt(w, d)}</td></tr>`).join("") +
    `</tbody></table><p class="lede" style="font-size:13px">${T.needed}: ${N(fmt(d.threshold_votes))} ${T.votes} (3.25%)${d.threshold_votes_adj ? ` · ${T.adjusted}: ${N(fmt(d.threshold_votes_adj))}` : ""}</p>`;
}

function renderSectors(d){
  if (!d.sectors.length) { $("sectorbox").innerHTML = `<div class="empty">${d.mode === "waiting" ? "–" : T.sectorsNone}</div>`; return; }
  $("sectorbox").innerHTML = `<table class="t"><thead><tr><th></th><th>${T.secCounted}</th><th>${T.secExpected}</th><th>${T.secPct}</th><th>${T.secLoc}</th></tr></thead><tbody>` +
    d.sectors.map(s => `<tr><td>${esc(T.sector[s.sector] || s.sector)}</td><td class="num">${N(fmt(s.counted))}</td><td class="num">${N(fmt(s.expected))}</td>` +
      `<td class="num">${pct(s.pct, 0)}<div class="sbar"><i style="width:${Math.min(100, (s.pct || 0) * 100).toFixed(1)}%"></i></div></td>` +
      `<td class="num">${s.sector === "envelopes" ? "" : N(fmt(s.reporting) + "/" + fmt(s.localities))}</td></tr>`).join("") + `</tbody></table>`;
}

function renderMethod(d){
  $("methodbox").innerHTML = `<ul>${T.method(d).map(x => `<li>${x}</li>`).join("")}${(d.notes || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
}

function renderFooter(d){
  $("foot-l").innerHTML = esc(T.footL);
  $("foot-r").innerHTML = `<a href="index.html">${T.back}</a><br>${T.generated} ${tfmt(d.generated_utc)}`;
}

/* Hebrew: every digit run sits in an LTR-isolated span, so numbers never reorder in RTL text */
function isolateNumbers(root){
  if (!HE) return;
  // a run ends on a digit or %, so trailing punctuation stays in the RTL flow
  const re = /[+−]?\d(?:[\d.,:]*\d)?%?(?:[–-]\d(?:[\d.,:]*\d)?%?)?/g;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n =>
    !/\d/.test(n.nodeValue) || n.parentElement.closest(".n, .ltr, bdi, .lt, script, style") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(t => {
    const f = document.createDocumentFragment(), s = t.nodeValue; let last = 0;
    s.replace(re, (m, i) => { if (i > last) f.appendChild(document.createTextNode(s.slice(last, i)));
      const sp = document.createElement("span"); sp.className = "ltr"; sp.textContent = m; f.appendChild(sp);
      last = i + m.length; return m; });
    if (last < s.length) f.appendChild(document.createTextNode(s.slice(last)));
    t.parentNode.replaceChild(f, t);
  });
}

function render(){
  const d = DATA;
  renderBanner(d); renderStatus(d); renderBlocs(d); renderSeats(d); renderWatch(d); renderSectors(d); renderMethod(d); renderFooter(d);
  renderAuto();
  isolateNumbers(document.body);
}

/* self-refresh: re-read the small JSON the script writes; re-render when it changes */
let lastCheck = null, fails = 0;
const REFRESH = (() => { const q = QS.get("refresh"); if (q != null && !isNaN(+q)) return +q; return DATA.refresh_seconds || 120; })();
function renderAuto(){
  const el = $("autostat"); if (!el) return;
  if (location.protocol === "file:" || !REFRESH) { el.textContent = T.autoOff; return; }
  el.innerHTML = `${T.autoOn} ${N(Math.round(REFRESH / 60 * 10) / 10)} ${T.autoMin}` + (lastCheck ? ` · ${T.lastCheck} ${tfmt(lastCheck.toISOString())}` : "") + (fails ? ` · ${N(fails)}×!` : "");
  isolateNumbers(el);
}
async function poll(){
  try {
    const r = await fetch(DATA.json_name + "?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(); fails = 0; lastCheck = new Date();
    if (d && d.generated_utc && d.generated_utc !== DATA.generated_utc) { DATA = d; render(); } else renderAuto();
  } catch (e) { fails++; renderAuto(); }
}
renderStatic(); render();
if (location.protocol !== "file:" && REFRESH > 0) setInterval(poll, REFRESH * 1000);
</script>
