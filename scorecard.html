*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font:400 16px/1.55 "IBM Plex Sans","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body,html[dir="rtl"] h1,html[dir="rtl"] h2{font-family:"IBM Plex Sans Hebrew","IBM Plex Sans",sans-serif;letter-spacing:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
h1,h2,h3{line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance}
.n,.ltr{direction:ltr;unicode-bidi:isolate}
.n{font-family:"IBM Plex Mono","IBM Plex Sans Hebrew",ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--ink);text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.skip{position:absolute;inset-inline-start:8px;top:8px;z-index:100;background:var(--ink);color:var(--paper);padding:10px 14px;font-weight:700;text-decoration:none;clip-path:inset(50%);white-space:nowrap}
.skip:focus{clip-path:none}
button,select{font:inherit}
.masthead{border-top:14px solid var(--ink);border-bottom:3px solid var(--ink);padding:18px 0 14px}
.masthead .wrap{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand{font-weight:700;font-size:22px;letter-spacing:-.01em;text-transform:uppercase}
.brand a{text-decoration:none}
.brand small{font-weight:500;font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.22em;display:block;margin-top:4px}
html[dir="rtl"] .brand small{letter-spacing:.04em}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl button{border:2px solid var(--ink);background:transparent;color:var(--ink);font:700 12px "IBM Plex Sans Hebrew","IBM Plex Sans",sans-serif;padding:7px 14px;cursor:pointer;letter-spacing:.06em;min-height:36px}
.dateline{font:500 11.5px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;text-align:end}
html[dir="rtl"] .dateline{letter-spacing:.02em}
.eyebrow{font:700 11px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
html[dir="rtl"] .eyebrow{letter-spacing:.03em}
section{padding:30px 0 6px}
section > h2{font-size:clamp(22px,3.2vw,30px);margin-bottom:6px}
.lede{color:var(--ink2);max-width:66ch;margin:6px 0 16px;font-size:15px}
.banner{margin:18px 0 0;border:3px solid var(--ink);padding:12px 16px;font-size:14.5px;background:var(--hit)}
.banner.rehearsal{border-color:var(--accent)}
.banner.warn{border-color:var(--warn)}
/* the frozen panel */
.frozen{border:3px solid var(--ink);padding:16px 18px 18px;margin-top:6px}
.frozen .k{font:700 10.5px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
html[dir="rtl"] .frozen .k{letter-spacing:.02em}
.sha{font:600 clamp(14px,2.2vw,19px)/1.4 "IBM Plex Mono",ui-monospace,monospace;word-break:break-all;overflow-wrap:anywhere;margin:6px 0 14px;direction:ltr;text-align:left;unicode-bidi:isolate}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px}
.facts div{min-width:0}
.facts .v{font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.cmd{font:500 12.5px "IBM Plex Mono",ui-monospace,monospace;background:var(--hit);padding:8px 10px;margin-top:14px;direction:ltr;text-align:left;overflow-wrap:anywhere}
.flag{font:600 10.5px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
html[dir="rtl"] .flag{letter-spacing:0}
.flag.in{color:var(--ok)} .flag.out{color:var(--warn)} .flag.na{color:var(--muted)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:3px solid var(--ink)}
.tile{padding:14px 14px 16px 0;border-inline-end:1px solid var(--hit);min-width:0}
html[dir="rtl"] .tile{padding:14px 0 16px 14px}
.tile:last-child{border-inline-end:0}
.tile .k{font:700 11px "IBM Plex Sans","IBM Plex Sans Hebrew",sans-serif;letter-spacing:.08em;text-transform:uppercase;min-height:30px}
html[dir="rtl"] .tile .k{letter-spacing:0}
.tile .big{font:600 clamp(30px,4.6vw,46px)/1 "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--muted);line-height:1.45}
.tile .res{font-size:13px;margin-top:6px;color:var(--ink)}
/* seat rows */
.sheet{border-top:3px solid var(--ink)}
.shead,.srow{display:grid;grid-template-columns:44px minmax(0,1.4fr) 60px 74px minmax(140px,1.6fr) 60px;gap:0 12px;align-items:center}
.sheet.res .shead,.sheet.res .srow{grid-template-columns:44px minmax(0,1.4fr) 60px 60px minmax(140px,1.6fr) 96px}
.shead{font:700 10px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:10px 0 8px;border-bottom:2px solid var(--ink);align-items:end}
html[dir="rtl"] .shead{letter-spacing:0}
.srow{padding:9px 0;border-bottom:1px solid var(--hit)}
.lt{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:28px;padding:0 5px;border:2px solid var(--pc,var(--dead));font:700 13px "IBM Plex Sans Hebrew",sans-serif;direction:rtl;color:var(--ink)}
.nm b{font-weight:600;font-size:15px;display:block;line-height:1.25}
.nm small{font-size:12px;color:var(--muted)}
.sv{font:600 21px/1 "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;text-align:center;font-variant-numeric:tabular-nums}
.sv.sub{font-weight:500;color:var(--ink2);font-size:15px}
.trk{position:relative;height:22px;direction:ltr}
.trk .axis{position:absolute;left:0;right:0;top:10px;height:1px;background:var(--hit)}
.trk .band{position:absolute;top:6px;height:10px;background:var(--hit);outline:1px solid var(--muted)}
.trk .ctr{position:absolute;top:3px;width:2px;height:16px;margin-left:-1px;background:var(--muted)}
.trk .dot{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--pc,var(--ink))}
.ivlab{font-size:11.5px;color:var(--muted);margin-top:1px}
.fl{text-align:end;line-height:1.35}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--ink2);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:11px;height:11px;border-radius:50%;background:var(--ink);display:inline-block}
.lg-band{width:22px;height:9px;background:var(--hit);outline:1px solid var(--muted);display:inline-block}
.lg-ctr{width:2px;height:14px;background:var(--muted);display:inline-block}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:3px solid var(--ink)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{font:700 10px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.08em;text-transform:uppercase;text-align:start;color:var(--ink2);padding:8px 10px 8px 0;border-bottom:2px solid var(--ink);vertical-align:bottom}
html[dir="rtl"] table.t th{letter-spacing:0;padding:8px 0 8px 10px}
table.t td{padding:9px 10px 9px 0;border-bottom:1px solid var(--hit);vertical-align:top}
html[dir="rtl"] table.t td{padding:9px 0 9px 10px}
table.t td.num,table.t th.num{text-align:end;white-space:nowrap}
table.t td.num{font-family:"IBM Plex Mono","IBM Plex Sans Hebrew",monospace;font-variant-numeric:tabular-nums}
table.t td.best{font-weight:700}
table.t td .sub,table.t th .sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
table.t th .sub{font-size:9.5px;letter-spacing:.04em;margin-top:2px}
table.t .mdl{min-width:190px}
#ordtab td:first-child{min-width:170px} #listtab td:first-child{min-width:120px}
td.where{min-width:150px;max-width:230px;font-size:13px} .warnt{color:var(--warn)}
table.t tr.off td{background:color-mix(in srgb,var(--hit) 55%,transparent)}
/* final polls */
table.t tr.ref td{border-top:2px solid var(--ink);color:var(--ink2)}
#polltab td:first-child{min-width:200px}
table.mat th,table.mat td{text-align:center;white-space:nowrap}
table.mat th:first-child,table.mat td:first-child{text-align:start;position:sticky;inset-inline-start:0;z-index:1;background:var(--paper);min-width:150px;white-space:normal}
table.mat th{min-width:62px}
table.mat td.num{text-align:center}
table.mat td .sub{font-size:11px}
table.mat td .sub.big{color:var(--warn);font-weight:700}
table.mat td .sub.hit{color:var(--ok);font-weight:700}
table.mat .offc{background:color-mix(in srgb,var(--hit) 55%,transparent)}
table.mat td.res,table.mat th.res{font-weight:700;border-inline-end:2px solid var(--ink)}
table.mat tr.tot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:700}
.chip{display:inline-block;font:600 10px "IBM Plex Mono","IBM Plex Sans Hebrew",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);border:1px solid var(--muted);padding:1px 5px;margin-top:3px;white-space:nowrap}
html[dir="rtl"] .chip{letter-spacing:0}
.pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;font-size:14px}
.pick select{border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:6px 8px;min-height:36px;max-width:100%}
/* PIT strip */
.pit{position:relative;height:46px;margin:6px 0 4px;direction:ltr;border-bottom:1px solid var(--muted)}
.pit .tail{position:absolute;top:0;bottom:0;background:var(--hit)}
.pit i{position:absolute;bottom:4px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--pc,var(--ink));opacity:.9}
.pitax{display:flex;justify-content:space-between;font:500 11px "IBM Plex Mono",monospace;color:var(--muted);direction:ltr}
.note{font-size:13.5px;color:var(--ink2);max-width:72ch;margin:10px 0 0}
.note.src{display:block}
.honest{border-inline-start:4px solid var(--accent);padding:4px 0 4px 14px;margin:16px 0 0;max-width:72ch;font-size:14.5px}
html[dir="rtl"] .honest{padding:4px 14px 4px 0}
.method ul{margin:8px 0 0;padding-inline-start:20px;max-width:78ch}
.method li{margin:6px 0;font-size:14px;color:var(--ink2)}
.method li b{color:var(--ink)}
footer{border-top:14px solid var(--ink);margin-top:46px;padding:22px 0 44px;font-size:12.5px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
@media (max-width:900px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{border-bottom:1px solid var(--hit)}
  .tile:nth-child(2n){border-inline-end:0}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .wrap{padding:0 16px}
  .masthead .wrap{align-items:flex-start}
  .dateline{text-align:start}
  .facts{grid-template-columns:1fr}
  .shead,.srow,.sheet.res .shead,.sheet.res .srow{grid-template-columns:40px minmax(0,1fr) 58px 50px;gap:4px 8px}
  .shead{letter-spacing:0;font-size:9.5px}
  .shead .h-ivl,.shead .h-fl{display:none}
  .srow .ivl{grid-column:2 / 5}
  .srow .fl{grid-column:2 / 5;text-align:start}
  .lt{min-width:34px;font-size:12px}
  .sv{font-size:18px}
  .nm b{font-size:14px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@media print{.ctl,.skip,.pick{display:none !important} body{background:#fff;color:#000}}
</style>

const OFF = P.models[0];
const lname = k => { const e = P.lists[k] || {}; return esc(HE ? (e.he || k) : (e.en || k)); };
const mname = m => esc(HE ? m.name.he : m.name.en);
const pcv = k => { const p = (P.lists[k] || {}).pvar; return p ? `--pc:var(--p-${p})` : "--pc:var(--dead)"; };
const pmName = n => esc(HE ? (DATA.labels.pm_he[n] || n) : (DATA.labels.pm_en[n] || n));
const SC = S ? Object.fromEntries(S.models.map(m => [m.id, m])) : {};

function renderStatic(){
  document.title = T.title;
  $("brand").textContent = T.brand; $("tagline").textContent = T.tagline; $("skip").textContent = T.skip;
  for (const k of ["frozen", "said", "polls", "scores", "ord", "method"]) {
    const e = $("e-" + k); if (e) e.textContent = T["e" + k[0].toUpperCase() + k.slice(1)];
  }
  const set = (id, h) => { $(id).innerHTML = h; };
  set("h-frozen", T.hFrozen); set("l-frozen", T.lFrozen);
  const src = R && R.source && R.source.url ? R.source : null;
  const srcLine = src ? `<span class="note src">${T.resSrc(`<a href="${esc(src.url)}" target="_blank" rel="noopener">${esc(src.url.replace(/^https?:\/\//, "").replace(/[?#].*$/, ""))}</a>`, tfmt(src.as_of_utc), src.certified)}</span>` : "";
  set("h-said", S ? T.hHappened : T.hSaid); set("l-said", S ? T.lHappened + srcLine : T.lSaid);
  set("h-scores", S ? T.hScores : T.hModels); set("l-scores", S ? T.lScores : T.lModels);
  set("h-ord", T.hOrd); set("l-ord", T.lOrd); set("pick-l", T.pickL);
  set("h-pit", T.hPit); set("l-pit", T.lPit);
  set("h-method", T.hMethod);
  $("dateline").innerHTML = `${T.built} <b>${tfmt(DATA.generated_utc)}</b><br>${T.israel}`;
  $("foot-l").textContent = T.footL;
  $("foot-r").innerHTML = `<a href="index.html">${T.back}</a> · <a href="election-night.html">${T.night}</a>`;
  const lb = $("langbtn"); lb.textContent = T.lang;
  lb.onclick = () => { try { localStorage.setItem("klang", HE ? "en" : "he"); } catch (e) {}
    const u = new URL(location.href); u.searchParams.delete("lang"); location.href = u.toString(); };
  const tb = $("themebtn");
  const eff = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  try { const s = localStorage.getItem("ktheme"); if (s === "light" || s === "dark") { document.documentElement.dataset.theme = s; document.documentElement.style.colorScheme = s; } } catch (e) {}
  const lab = () => { tb.textContent = eff() === "dark" ? T.light : T.dark; };
  lab();
  tb.onclick = () => { const n = eff() === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = n;
    document.documentElement.style.colorScheme = n; try { localStorage.setItem("ktheme", n); } catch (e) {} lab(); };
}

function renderBanner(){
  let h = "";
  if (DATA.mode === "rehearsal") h += `<div class="banner rehearsal"><b>${T.rehearsal}</b> ${T.rehearsalTxt}</div>`;
  else if (!S) h += `<div class="banner"><b>${T.pre}</b> ${T.preTxt}</div>`;
  if (!FZ.verified) h += `<div class="banner warn"><b>${T.badHash}</b></div>`;
  $("banner").innerHTML = h;
}

function renderFrozen(){
  const pv = P.provenance || {};
  const head = pv.git_head ? pv.git_head.slice(0, 12) : "–";
  const facts = [
    [T.asof, `<bdi>${N(esc(P.asof))}</bdi>`],
    [T.frozenAt, tfmt(P.frozen_utc)],
    [T.status, P.final ? T.final : T.provisional],
    [T.commit, N(esc(head))],
    [T.file, FZ.file ? N(esc(FZ.file)) : "–"],
    [T.models, N(P.models.length)],
  ];
  $("frozen").innerHTML = `<div class="k">${T.sha}</div><div class="sha">${esc(FZ.sha256)}</div>` +
    `<div class="facts">${facts.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("")}</div>` +
    (FZ.file ? `<div class="cmd">python src/scorecard.py --verify ${esc(FZ.file)}</div>` : "") +
    `<div class="note">${FZ.verified ? `<span class="flag in">✓</span> ${T.verified}` : `<span class="flag out">✗</span> ${T.badHash}`}</div>`;
}

function tile(k, p, extra, res){
  return `<div class="tile"><div class="k">${k}</div><div class="big">${p == null ? "–" : pct(p)}</div><div class="s">${extra}</div>${res || ""}</div>`;
}

function renderSaid(){
  const b = OFF.blocs || {}, ba = S ? S.blocs_actual : null;
  const res = (seats, p) => ba ? `<div class="res">${T.won}: ${N(seats)} ${T.seatsW} · ${seats >= 61 ? T.happened : T.notHappened}</div>` : "";
  let h = tile(T.nb, b.nb, `${T.p61}${b.nb_mean != null ? ` · ${N(b.nb_mean)} [${N(b.nb_p05 + "–" + b.nb_p95)}]` : ""}`, ba ? res(ba.nb) : "");
  h += tile(T.anti, b.anti, T.p61, ba ? res(ba.anti) : "");
  h += tile(T.antiRaam, b.antiRaam, T.p61, ba ? res(ba.antiRaam) : "");
  if (OFF.groups) {
    const top = Object.entries(OFF.groups).filter(([g]) => T.groups[g]).sort((x, y) => y[1] - x[1]);
    const gov = S && S.government ? `<div class="res">${T.won}: ${esc(T.groups[S.government])}</div>` : "";
    h += `<div class="tile"><div class="k">${T.gov}</div><div class="s" style="margin-top:10px">${top.map(([g, p]) => `${esc(T.groups[g])} ${pct(p)}`).join("<br>")}</div>${gov}</div>`;
  } else {
    h += tile(T.neither, b.neither, "", "");
  }
  $("tiles").innerHTML = h;
  const keys = Object.keys(P.lists).filter(k => (OFF.central[k] || 0) > 0 || ((OFF.interval[k] || [0, 0])[1] > 0) || (R && (R.seats[k] || 0) > 0));
  const maxv = Math.max(10, ...keys.map(k => Math.max((OFF.interval[k] || [0, 0])[1], R ? (R.seats[k] || 0) : 0))) + 2;
  const x = v => (100 * v / maxv).toFixed(2) + "%";
  $("sheet").classList.toggle("res", !!S);
  $("shead").innerHTML = `<div></div><div>${T.colList}</div><div style="text-align:center">${T.colC}</div><div style="text-align:center">${S ? T.colY : T.colPass}</div><div class="h-ivl">${T.colIvl}</div><div class="h-fl" style="text-align:end">${S ? T.colFl : ""}</div>`;
  const ol = S ? SC.official.lists : {};
  $("srows").innerHTML = keys.map(k => {
    const e = P.lists[k] || {}, iv = OFF.interval[k] || [0, 0], c = OFF.central[k] || 0;
    const y = R ? (R.seats[k] || 0) : null, sl = ol[k];
    let trk = `<div class="trk" style="${pcv(k)}"><i class="axis"></i><i class="band" style="left:${x(iv[0])};width:${x(iv[1] - iv[0])}"></i><i class="ctr" style="left:${x(c)}"></i>${y != null ? `<i class="dot" style="left:${x(y)}"></i>` : ""}</div>`;
    const pass = sl ? null : (() => { const pm = OFF.pmf[k]; if (!pm) return 0; const n = pm.slice(1).reduce((a, v) => a + v, 0); return pm[0] > 0 ? 1 : 1 - pm[1] / n; })();
    const fl = S ? (sl.covered ? `<span class="flag in">${T.inside}</span>` : `<span class="flag out">${T.outside} ${y > iv[1] ? "↑" : "↓"}</span>`) : "";
    return `<div class="srow"><div><span class="lt" style="${pcv(k)}">${esc(e.letter || "")}</span></div>` +
      `<div class="nm"><b>${lname(k)}</b></div><div class="sv${S ? " sub" : ""}">${N(c)}</div>` +
      `<div class="sv">${S ? N(y) : `<span style="font-size:14px">${pct(pass)}</span>`}</div>` +
      `<div class="ivl">${trk}<div class="ivlab">${T.colIvl} ${N(iv[0] + "–" + iv[1])}</div></div><div class="fl">${fl}</div></div>`;
  }).join("");
  $("legend").innerHTML = `<span><i class="lg-band"></i>${T.lgBand}</span><span><i class="lg-ctr"></i>${T.lgCtr}</span>` + (S ? `<span><i class="lg-dot"></i>${T.lgDot}</span>` : "");
}

/* the model against the final polls (DATA.polls: scorecard.poll_comparison) */
const OUT_HE = {"i24 News": "i24NEWS", "Channel 12": "חדשות 12", "Channel 13": "חדשות 13", "Channel 14": "ערוץ 14", "Channel 16": "ערוץ 16",
  "Kan 11": "כאן 11", "Israel Hayom": "ישראל היום", "Maariv": "מעריב", "Walla": "וואלה", "Zman Yisrael": "זמן ישראל"};
const FIRM_HE = {"Direct Polls": "דיירקט פולס", "Filber": "פילבר", "Kantar": "קנטאר", "Midgam": "מדגם", "Midgam Project": "פרויקט המדגם",
  "Tatika": "טאטיקה", "Lazar": "לזר", "Maagar Mochot": "מאגר מוחות"};
const dfmt = (iso, month) => iso ? "<bdi>" + new Intl.DateTimeFormat(HE ? "he-IL" : "en-GB", {day: "numeric", month: month, timeZone: "UTC"}).format(new Date(iso + "T00:00:00Z")) + "</bdi>" : "–";
const sgn = (v, d = 0) => v == null ? "–" : N((v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d));

function renderPolls(){
  const PC = DATA.polls;
  $("polls-sec").hidden = !PC;
  if (!PC) return;
  $("h-polls").innerHTML = T.hPolls; $("l-polls").innerHTML = T.lPolls(dfmt(PC.since, "long"));
  $("h-pmat").innerHTML = T.hPmat; $("l-pmat").innerHTML = T.lPmat;
  const isPoll = r => r.kind === "poll" || r.kind === "panel";
  const outN = r => r.kind === "model" ? T.mdl : r.kind === "average" ? T.avg(PC.n_polls) : esc(HE ? (OUT_HE[r.outlet] || r.outlet) : r.outlet);
  const firmN = r => r.kind === "model" ? `<span class="chip">${T.mdlChip}</span>` : r.kind === "average" ? `<span class="chip">${T.avgChip}</span>` : esc(HE ? (FIRM_HE[r.firm] || r.firm) : r.firm);
  const rows = PC.rows, A = PC.average, M = rows.find(r => r.kind === "model");
  const best = get => Math.min(...rows.map(get).filter(v => v != null));
  const cell = (r, get, txt) => `<td class="num${r.kind !== "average" && get(r) != null && get(r) === best(get) ? " best" : ""}">${txt}</td>`;
  const line = r => { const avg = r.kind === "average";
    return `<tr class="${r.kind === "model" ? "off" : avg ? "ref" : ""}"><td>${outN(r)}<span class="sub">${firmN(r)}</span></td><td class="num">${dfmt(r.date, "short")}</td>` +
      cell(r, x => x.err, avg ? f(r.err, 1) : N(r.err)) + cell(r, x => Math.abs(x.nb), sgn(r.nb, avg ? 1 : 0)) +
      cell(r, x => x.thr, r.thr == null ? "–" : N(r.thr)) +
      cell(r, x => x.share_mae, f(r.share_mae, 2) + (r.share_basis ? `<span class="sub">${esc(T.basis[r.share_basis] || r.share_basis)}</span>` : "")) + "</tr>"; };
  $("polltab").innerHTML = `<thead><tr><th>${T.thFc}</th><th class="num">${T.thDate}</th><th class="num">${T.thMiss}<span class="sub">${T.missSub}</span></th><th class="num">${T.thNbE}<span class="sub">${T.nbSub}</span></th><th class="num">${T.thThr}<span class="sub">${T.thrSub}</span></th><th class="num">${T.thShare}<span class="sub">${T.shareSub}</span></th></tr></thead><tbody>` +
    rows.map(line).join("") + line(A) + "</tbody>";
  const cols = [M, ...rows.filter(isPoll), A];
  const colN = c => c.kind === "model" ? T.mdl : c.kind === "average" ? T.avgShort : outN(c);
  const oc = c => c.kind === "model" ? " offc" : "";
  const val = (c, k) => { const y = PC.result[k], v = c.seats[k], d = v - y, avg = c.kind === "average";
    const dd = Math.abs(d) < 0.05 ? `<span class="sub hit">✓</span>` : `<span class="sub${Math.abs(d) >= 3 ? " big" : ""}">${sgn(d, avg ? 1 : 0)}</span>`;
    return `<td class="num${oc(c)}">${N(avg ? v.toFixed(1) : v)}${dd}</td>`; };
  $("pmat").innerHTML = `<thead><tr><th>${T.colList}</th><th class="res">${T.colRes}</th>` +
    cols.map(c => `<th class="${oc(c).trim()}">${colN(c)}${isPoll(c) ? `<span class="sub">${firmN(c)}</span>` : ""}</th>`).join("") + "</tr></thead><tbody>" +
    PC.lists.map(k => `<tr><td>${lname(k)}</td><td class="num res">${N(PC.result[k])}</td>${cols.map(c => val(c, k)).join("")}</tr>`).join("") +
    `<tr class="tot"><td>${T.tot}</td><td class="num res"></td>${cols.map(c => `<td class="num${oc(c)}">${c.kind === "average" ? f(c.err, 1) : N(c.err)}</td>`).join("")}</tr></tbody>`;
  $("pnote").innerHTML = `<p class="note">${T.pnote(PC.lists.length)}</p>`;
}

const status = m => `<span class="chip">${esc(T.status_[m.status] || m.status)}</span>`;
const own = m => { const e = m.backtest && m.backtest.eve; return e ? e : null; };

function renderScores(){
  const ms = P.models;
  if (!S) {
    $("scoretab").innerHTML = `<thead><tr><th class="mdl">${T.thModel}</th><th class="num">${T.thNb}</th><th class="num">${T.thAnti}</th><th class="num">${T.thBack}</th></tr></thead><tbody>` +
      ms.map(m => `<tr class="${m.id === "official" ? "off" : ""}"><td class="mdl">${mname(m)}<br>${status(m)}</td><td class="num">${pct((m.blocs || {}).nb, 1)}</td><td class="num">${pct((m.blocs || {}).anti, 1)}</td><td class="num">${own(m) ? f(own(m).median_mae, 2) : "–"}</td></tr>`).join("") + "</tbody>";
    $("ord-sec").hidden = true;
    return;
  }
  const rows = S.ranking.map(id => [P.models.find(m => m.id === id), SC[id]]);
  const best = (get, hi) => { const v = rows.map(([, s]) => get(s)).filter(x => x != null); return v.length ? (hi ? Math.max(...v) : Math.min(...v)) : null; };
  const cell = (s, get, hi, d) => { const v = get(s), b = best(get, hi); return `<td class="num${v != null && v === b ? " best" : ""}">${f(v, d)}</td>`; };
  const bl = (s, k) => s.blocs[k] ? `<td class="num">${f(s.blocs[k].brier, 3)}<span class="sub">${f(s.blocs[k].log, 2)}</span></td>` : `<td class="num">–</td>`;
  const one = (x) => x ? `<td class="num">${f(x.log, 2)}<span class="sub">${pct(x.p, 1)}</span></td>` : `<td class="num">${T.pending}</td>`;
  $("scoretab").innerHTML = `<thead><tr><th class="num">${T.thRank}</th><th class="mdl">${T.thModel}</th><th class="num">${T.thLog}<span class="sub">${T.logSub}</span></th><th class="num">${T.thCrps}<span class="sub">${T.crpsSub}</span></th><th class="num">${T.thErr}<span class="sub">${T.errSub}</span></th><th class="num">${T.thCov}</th><th class="num">${T.thBrier}</th><th class="num">${T.thNb}<span class="sub">${T.brSub}</span></th><th class="num">${T.thAnti}<span class="sub">${T.brSub}</span></th><th class="num">${T.thGov}</th><th class="num">${T.thPm}</th></tr></thead><tbody>` +
    rows.map(([m, s]) => `<tr class="${m.id === "official" ? "off" : ""}"><td class="num">${N(s.rank)}</td><td class="mdl">${mname(m)}<br>${status(m)}</td>` +
      cell(s, x => x.summary.log, true, 3) + cell(s, x => x.summary.crps, false, 3) + cell(s, x => x.summary.abs_err, false, 2) +
      `<td class="num">${pct(s.summary.coverage)}</td>` + cell(s, x => x.summary.brier, false, 4) +
      bl(s, "nb") + bl(s, "anti") + one(s.formation) + one(s.pm) + "</tr>").join("") + "</tbody>";
  $("honest").innerHTML = `<p class="honest">${T.honest(S.scored.length)}</p>`;
  const sel = $("model");
  sel.innerHTML = rows.map(([m]) => `<option value="${esc(m.id)}">${mname(m)}</option>`).join("");
  sel.value = "official";
  sel.onchange = () => renderOrd(sel.value);
  renderOrd("official");
}

function renderOrd(id){
  const m = P.models.find(x => x.id === id), s = SC[id], rec = P.record || {};
  const ob = own(m);
  const where = e => {
    if (!e) return T.noRec;
    if (e.inside) return T.insideRec + (e.beats != null ? `<span class="sub">${T.better(e.beats, e.n)}</span>` : "");
    if (e.beats != null && e.beats === e.n) return `<b>${T.aboveRec}</b>`;
    if (e.beats === 0) return `<b class="warnt">${T.belowRec}</b>`;
    return `<b>${T.outsideRec}</b>`;
  };
  const sx = s.expect_self || {};
  const selfCell = (e, d) => !e ? "–" : f(e.mean, d) + (e.p05 != null ? `<span class="sub">${N(Number(e.p05).toFixed(d) + " – " + Number(e.p95).toFixed(d))}${e.inside === false ? ` · <b class="flag out">${T.outside}</b>` : (e.inside ? ` · <span class="flag in">${T.inside}</span>` : "")}</span>` : "");
  const line = (lab, v, d, e, se, ownv) => `<tr><td>${lab}</td><td class="num">${f(v, d)}</td><td class="num">${e ? N(Number(e.min).toFixed(d) + " – " + Number(e.max).toFixed(d)) + `<span class="sub">${T.meanW} ${f(e.mean, d)}</span>` : "–"}</td><td class="where">${where(e)}</td><td class="num">${selfCell(se, d)}</td><td class="num">${ownv == null ? T.noOwn : ownv}</td></tr>`;
  const x = s.expect;
  let h = `<thead><tr><th>${T.thScore}</th><th class="num">${T.th26}</th><th class="num">${T.thRec}</th><th>${T.thWhere}</th><th class="num">${T.thSelf}</th><th class="num">${T.thOwn}</th></tr></thead><tbody>`;
  h += line(T.mLog, s.summary.log, 3, x.log, sx.log, null);
  h += line(T.mCrps, s.summary.crps, 3, x.crps, sx.crps, null);
  h += line(T.mErr, s.summary.abs_err, 2, x.abs_err, sx.abs_err, ob ? `${f(ob.median_mae, 2)}<span class="sub">${T.ownMed}</span>` : null);
  h += line(T.mCov, s.summary.coverage, 2, x.coverage, sx.coverage, ob ? f(ob.coverage, 2) : null);
  h += line(T.mBrier, s.summary.brier, 4, x.brier, sx.brier, ob ? f(ob.brier, 4) : null);
  if (s.blocs.nb) { h += line(T.mNbBrier, s.blocs.nb.brier, 3, x.nb_brier, sx.nb_brier, null); h += line(T.mNbLog, s.blocs.nb.log, 3, x.nb_log, sx.nb_log, null); }
  if (s.blocs.anti) { h += line(T.mAntiBrier, s.blocs.anti.brier, 3, null, sx.anti_brier, null); h += line(T.mAntiLog, s.blocs.anti.log, 3, null, sx.anti_log, null); }
  if (s.formation) h += `<tr><td>${T.mGov}</td><td class="num">${f(s.formation.log, 3)}</td><td colspan="4">${esc(T.groups[s.formation.group] || s.formation.group)} · ${pct(s.formation.p, 1)} · ${T.uniform(f(rec.uniform_group_log, 3))}</td></tr>`;
  if (s.pm) h += `<tr><td>${T.mPm}</td><td class="num">${f(s.pm.log, 3)}</td><td colspan="4">${pmName(s.pm.name)} · ${pct(s.pm.p, 1)}</td></tr>`;
  $("ordtab").innerHTML = h + "</tbody>";
  const keys = S.scored;
  $("pit").innerHTML = `<i class="tail" style="left:0;width:5%"></i><i class="tail" style="left:95%;width:5%"></i>` +
    keys.map((k, i) => `<i style="left:${(100 * s.lists[k].pit).toFixed(2)}%;bottom:${4 + 12 * (i % 3)}px;${pcv(k)}" title="${lname(k)}"></i>`).join("");
  $("listtab").innerHTML = `<thead><tr><th>${T.colList}</th><th class="num">${T.thY}</th><th class="num">${T.thC}</th><th class="num">${T.colIvl}</th><th class="num">${T.thLogL}</th><th class="num">${T.thCrps}</th><th class="num">${T.thPit}</th><th class="num">${T.thBr}</th></tr></thead><tbody>` +
    S.every.filter(k => s.lists[k].scored || s.lists[k].p_pass >= 0.005).map(k => { const r = s.lists[k]; const sur = r.pit < 0.05 || r.pit > 0.95;
      return `<tr><td>${lname(k)}</td><td class="num">${N(r.y)}</td><td class="num">${N(r.central)}</td><td class="num">${N(r.lo + "–" + r.hi)}</td><td class="num">${r.scored ? f(r.log, 2) : "–"}</td><td class="num">${r.scored ? f(r.crps, 2) : "–"}</td><td class="num">${f(r.pit, 2)}${sur ? `<span class="sub flag out">${T.surprise}</span>` : ""}</td><td class="num">${f(r.brier, 3)}</td></tr>`; }).join("") + "</tbody>";
}

function renderMethod(){
  const n = OFF.n_sims || 0;
  $("methodbox").innerHTML = "<ul>" + T.method({n: n, file: FZ.file || "data/processed/frozen_forecast_<asof>.json"}).map(x => `<li>${x}</li>`).join("") + "</ul>";
}

renderStatic(); renderBanner(); renderFrozen(); renderSaid(); renderPolls(); renderScores(); renderMethod();
</script>
</body>
